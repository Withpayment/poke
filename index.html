<body>
<div class="app">
  <header class="top">
    <div class="eyebrow" id="resetHiddenBtn" title="게임 초기화 (숨김)">🔧</div>

    </div>

    <!-- ===== 나이 입력 화면 ===== -->
    <div id="ageScreen" style="display:none;">
      <div class="panel age-input-wrap">
        <div class="big-emoji">👋</div>
        <div class="title">안녕! 몇 살이야?</div>
        <div class="sub">나이에 맞는 재미있는 수학 퀴즈를 준비할게!</div>

          <button class="btn" onclick="setAge(5)">5살</button>
          <button class="btn" onclick="setAge(6)">6살</button>
          <button class="btn" onclick="setAge(7)">7살</button>
          <button class="btn" onclick="setAge(8)">8살</button>
          <button class="btn" onclick="setAge(9)">9살</button>
          <button class="btn" onclick="setAge(10)">10살</button>

          <button class="btn small" onclick="setAge(document.getElementById('customAgeInput').value)" style="min-height:48px;">확인</button>
        </div>
      </div>
    </div>

    <section id="tab-mission">
      <h2 class="section-title">🎯 오늘의 미션</h2>

        <button data-mmode="quiz" class="active">🧠 퀴즈미션</button>
        <button data-mmode="math">🧮 수학퀴즈</button>
        <button data-mmode="life">🌟 생활미션</button>
        <button data-mmode="raid">⚔️ 레이드</button>
      </div>
      <div class="panel" id="missionPanel"></div>
    </section>

    <section id="tab-dex">
      <h2 class="section-title">📖 도감</h2>
      <div class="progress-bar"><div id="dexProgress" style="width:0%"></div></div>
      <div class="progress-txt" id="dexProgressText">0 / 0</div>

function getEffMult(attackType, defendType) {
  const chart = TYPE_CHART[attackType];
  if (!chart) return 1;
  if (chart.immune && chart.immune.includes(defendType)) return 0;
  if (chart.strong && chart.strong.includes(defendType)) return 2;
  if (chart.weak && chart.weak.includes(defendType)) return 0.5;
  return 1;
}

function rollRarity() {
  const total = RARITIES.reduce((sum, r) => sum + r.weight, 0);
  let rand = Math.random() * total;
  for (const r of RARITIES) {
    rand -= r.weight;
    if (rand <= 0) return r.id;
  }
  return 'common';
}

function getRarityInfo(id) {
  return RARITIES.find(r => r.id === id) || RARITIES[0];
}

function getRarityBonus(id) {
  const info = getRarityInfo(id);
  return info.bonus || { hp: 0, atk: 0, def: 0, spd: 0 };
}

const CACHE_DURATION = 7 * 24 * 60 * 60 * 1000;

async function loadAllPokemon() {
  try {
    const cached = localStorage.getItem(CACHE_KEY);
    const cachedTime = localStorage.getItem(CACHE_TIME_KEY);
    
    if (cached && cachedTime && (Date.now() - parseInt(cachedTime)) < CACHE_DURATION) {
      POKEMON_LIST = JSON.parse(cached);
      console.log('✅ 캐시에서 로드!', POKEMON_LIST.length + '마리');
      document.getElementById('loadingStatus').textContent = '캐시에서 ' + POKEMON_LIST.length + '마리 로드! ⚡';
      return POKEMON_LIST;
    }
  } catch(e) {
    console.log('캐시 확인 실패:', e);
  }
  
  try {
    const listRes = await fetch('https://pokeapi.co/api/v2/pokemon?limit=10000');
    const listData = await listRes.json();
    const allUrls = listData.results.map(p => p.url);
    const batchSize = 50;
    let allPokemon = [];
    
    for (let i = 0; i < allUrls.length; i += batchSize) {
      const batch = allUrls.slice(i, i + batchSize);
      const promises = batch.map(async (url) => {
        try {
          const detailRes = await fetch(url);
          const detail = await detailRes.json();
          let koreanName = detail.name;
          try {
            const speciesRes = await fetch(detail.species.url);
            const speciesData = await speciesRes.json();
            const name = speciesData.names.find(n => n.language.name === 'ko');
            if (name) koreanName = name.name;
          } catch (e) {}
          return {
            id: detail.id,
            name: koreanName,
            engName: detail.name,
            type: detail.types[0].type.name,
            types: detail.types.map(t => t.type.name),
            hp: detail.stats[0].base_stat,
            atk: detail.stats[1].base_stat,
            def: detail.stats[2].base_stat,
            spd: detail.stats[5].base_stat,
            image: detail.sprites.other['official-artwork']?.front_default || detail.sprites.front_default,
            speciesUrl: detail.species.url,
            cryUrl: detail.cries?.latest || detail.cries?.legacy || null
          };
        } catch (e) {
          return null;
        }
      });
      const results = await Promise.all(promises);
      allPokemon = allPokemon.concat(results.filter(p => p !== null));
      const total = allUrls.length;
      const done = allPokemon.length;
      document.getElementById('loadingStatus').textContent = 'PokeAPI 로딩 중... ' + done + '/' + total;
    }
    allPokemon.sort((a, b) => a.id - b.id);
    POKEMON_LIST = allPokemon;
    console.log('✅ API에서 로드!', POKEMON_LIST.length + '마리');
    try {
      localStorage.setItem(CACHE_KEY, JSON.stringify(POKEMON_LIST));
      localStorage.setItem(CACHE_TIME_KEY, String(Date.now()));
      console.log('💾 캐시 저장 완료!');
    } catch(e) {}
    return POKEMON_LIST;
  } catch (error) {
    console.error('❌ API 로드 실패:', error);
    POKEMON_LIST = getFallbackData();
    return POKEMON_LIST;
  }
}

async function getAllEvolvablePokemon() {
  try {
    const listRes = await fetch('https://pokeapi.co/api/v2/evolution-chain?limit=1000');
    const listData = await listRes.json();
    const allEvolvable = [];
    for (const chainRef of listData.results) {
      const chainRes = await fetch(chainRef.url);
      const chainData = await chainRes.json();
      function extractAllNames(chainLink) {
        const names = [];
        names.push(chainLink.species.name);
        if (chainLink.evolves_to && chainLink.evolves_to.length > 0) {
          for (const nextLink of chainLink.evolves_to) {
            names.push(...extractAllNames(nextLink));
          }
        }
        return names;
      }
      allEvolvable.push(...extractAllNames(chainData.chain));
    }
    const unique = [...new Set(allEvolvable)].sort();
    console.log('✅ 진화 가능 포켓몬', unique.length + '종');
    return unique;
  } catch (error) {
    console.error('❌ 진화 가능 포켓몬 로드 실패:', error);
    return ['bulbasaur', 'charmander', 'squirtle', 'pikachu', 'eevee', 'magikarp'];
  }
}

function formatTime(ms) {
  if (ms <= 0) return '⏳ 준비 완료!';
  const hours = Math.floor(ms / 3600000);
  const minutes = Math.floor((ms % 3600000) / 60000);
  const seconds = Math.floor((ms % 60000) / 1000);
  if (hours > 0) return hours + '시간 ' + minutes + '분';
  if (minutes > 0) return minutes + '분 ' + seconds + '초';
  return seconds + '초';
}

function speakText(text, lang = 'ko-KR') {
  if (!window.speechSynthesis) return;
  window.speechSynthesis.cancel();
  const utterance = new SpeechSynthesisUtterance(text);
  utterance.lang = lang;
  utterance.rate = 0.9;
  utterance.pitch = 1.0;
  utterance.volume = 1.0;
  const voices = window.speechSynthesis.getVoices();
  let selectedVoice = voices.find(v => v.lang.startsWith('ko') && (v.name.includes('InJoon') || v.name.includes('남자')));
  if (!selectedVoice) selectedVoice = voices.find(v => v.lang.startsWith('ko'));
  if (selectedVoice) utterance.voice = selectedVoice;
  window.speechSynthesis.speak(utterance);
}

function speakPokemonInfo(pokemon) {
  if (!pokemon) return;
  const typeLabel = getTypeLabel(pokemon.type);
  let text = `${pokemon.name} ${typeLabel}타입 포켓몬! `;
  if (pokemon._moves && pokemon._moves.length > 0) {
    text += `배우는 기술은 ${pokemon._moves.slice(0, 3).join(', ')}! `;
  }
  if (pokemon._description) text += `${pokemon._description} `;
  speakText(text);
}

function grantCardReward() {
  const locked = POKEMON_LIST.filter(c => !state.owned[c.engName]);
  const pool = locked.length > 0 ? locked : POKEMON_LIST;
  const target = pool[Math.floor(Math.random() * pool.length)];
  const rarity = rollRarity();
  const isNew = !state.owned[target.engName];
  
  if (!state.owned[target.engName]) {
    state.owned[target.engName] = { count: 1, rarity: rarity };
  } else {
    state.owned[target.engName].count += 1;
  }
  
  state.missionsWon = (state.missionsWon || 0) + 1;
  
  const title = isNew ? '🎉 새 포켓몬 획득!' : '🔄 중복 획득!';
  const subtitle = isNew ? '도감에 등록되었어요!' : `${getRarityInfo(rarity).label} 등급!`;
  showRewardPopup(target, title, subtitle);
  
  updateStatline();
  saveState();
  renderDex();
  return { target, rarity, isNew };
}

function renderQuizMission() {

  const allMissions = [...DEFAULT_LIFE_MISSIONS, ...(state.customMissions || [])];
  const allDone = allMissions.every(m => doneToday[m.id]);
  const quizDoneToday = state.quizDoneToday === key;

    panel.innerHTML = `
      <div class="mission-intro">
        <div class="big-emoji">🔒</div>
        <div class="title-text">퀴즈가 잠겨있어요!</div>
        <div class="sub-text">오늘의 생활미션을 모두 완료해야 퀴즈를 풀 수 있어요.</div>

      </div>
    `;
    return;
  }
  
  if (quizDoneToday) {
    panel.innerHTML = `
      <div class="mission-intro">
        <div class="big-emoji">✅</div>
        <div class="title-text">오늘의 퀴즈를 이미 풀었어요!</div>
        <div class="sub-text">내일 다시 도전해주세요 😊</div>
      </div>
    `;
    return;
  }
  
  if (currentQuiz.isFinished) {
    const rewardChance = currentQuiz.correctCount > 0 ? 10 : 0;
    const gotCard = Math.random() * 100 < rewardChance;
    state.quizDoneToday = key;
    saveState();
    
    panel.innerHTML = `
      <div class="mission-intro">
        <div class="big-emoji">📊</div>
        <div class="title-text">퀴즈 완료!</div>
        <div style="font-size:18px;color:#B7AFDE;margin:8px 0;">
          ${currentQuiz.totalQuestions}문제 중 ${currentQuiz.correctCount}문제 정답!
        </div>
        ${gotCard ? `
          <div style="background:rgba(255,201,60,.15);border-radius:12px;padding:14px;margin:12px 0;border:2px solid var(--sun);">
            🎉 축하합니다! 10% 확률로 카드 획득!
          </div>
        ` : `
          <div style="color:#8d84b0;font-size:14px;margin:10px 0;">💡 정답 시 10% 확률로 카드 획득</div>
        `}
        <button class="btn small" id="resetQuizBtn">새 퀴즈 (내일)</button>
      </div>
    `;
    
    if (gotCard) {
      const result = grantCardReward();
      if (result) {
        const rInfo = getRarityInfo(result.rarity);
        setTimeout(() => {
          const rewardDiv = panel.querySelector('.mission-intro');
          if (rewardDiv) {
            rewardDiv.innerHTML += `
              <div style="margin-top:14px;">
                <div class="card pop-in rarity-${result.rarity}" style="width:160px;margin:0 auto;">
                  <div class="art">${pokemonImage(result.target)}</div>
                  <div class="name">${result.target.name}</div>
                  <span class="type-tag" style="background:${getTypeColor(result.target.type)}">${getTypeLabel(result.target.type)}</span>
                  <span class="rarity-badge" style="background:${rInfo.color}">${rInfo.emoji} ${rInfo.label}</span>
                </div>
              </div>
            `;
          }
        }, 300);
      }
    }
    
    const resetBtn = document.getElementById('resetQuizBtn');
    if (resetBtn) {
      resetBtn.replaceWith(resetBtn.cloneNode(true));
      document.getElementById('resetQuizBtn').addEventListener('click', function() {
        currentQuiz = { questions: [], currentIndex: 0, correctCount: 0, isFinished: false };
        renderQuizMission();
      });
    }

  }
  
  if (currentQuiz.questions.length === 0) {

  const q = currentQuiz.questions[currentQuiz.currentIndex];
  if (!q) {
    currentQuiz.isFinished = true;
    renderQuizMission();
    return;
  }
  
  const progress = (currentQuiz.currentIndex + 1) + ' / ' + currentQuiz.questions.length;
  panel.innerHTML = `
    <div class="quiz-box">

  });

function generateQuizQuestions() {
  const total = 20;
  const questions = [];
  const shuffled = [...POKEMON_LIST].sort(() => Math.random() - 0.5);
  
  for (let i = 0; i < Math.min(total, shuffled.length); i++) {
    const pokemon = shuffled[i];
    const type = Math.random() < 0.5 ? 'silhouette' : 'type';
    let question, options, correctAnswer;
    
    if (type === 'silhouette') {
      question = '🕵️ 이 포켓몬은 누구일까요?';
      const distractors = getDistractors(pokemon, 3);
      const allOptions = [pokemon.name, ...distractors.map(d => d.name)].sort(() => Math.random() - 0.5);
      options = allOptions;
      correctAnswer = pokemon.name;
    } else {
      question = pokemon.name + '의 타입은?';
      const allTypes = Object.keys(TYPE_CHART);
      const wrongTypes = allTypes.filter(t => t !== pokemon.type).sort(() => Math.random() - 0.5).slice(0, 3);
      const allOptions = [getTypeLabel(pokemon.type), ...wrongTypes.map(t => getTypeLabel(t))].sort(() => Math.random() - 0.5);
      options = allOptions;
      correctAnswer = getTypeLabel(pokemon.type);
    }
    
    questions.push({
      pokemon,
      type,
      question,
      options,
      correctAnswer
    });
  }
  
  currentQuiz.questions = questions;
  currentQuiz.currentIndex = 0;
  currentQuiz.correctCount = 0;
  currentQuiz.totalQuestions = questions.length;
  currentQuiz.isFinished = false;
}

function getDistractors(exclude, n) {
  const pool = POKEMON_LIST.filter(c => c.engName !== exclude.engName);
  const picked = [];
  while (picked.length < n && pool.length) {
    const idx = Math.floor(Math.random() * pool.length);
    picked.push(pool.splice(idx, 1)[0]);
  }
  return picked;
}

function handleQuizAnswer(isCorrect) {
  document.querySelectorAll('.choice-btn').forEach(b => {
    b.classList.add('dim');
    b.disabled = true;
    if (b.dataset.answer === currentQuiz.questions[currentQuiz.currentIndex].correctAnswer) {
      b.classList.add('correct');
    } else if (!isCorrect && b.classList.contains('dim') && !b.classList.contains('correct')) {
      b.classList.add('wrong');
    }
  });
  
  const fb = document.getElementById('quizFeedback');
  state.quizStats.total = (state.quizStats.total || 0) + 1;
  
  if (isCorrect) {
    state.quizStats.correct = (state.quizStats.correct || 0) + 1;
    currentQuiz.correctCount++;
    fb.textContent = '✅ 정답!';
    fb.className = 'quiz-feedback ok';
    
    const rewardChance = 10;
    const gotCard = Math.random() * 100 < rewardChance;
    if (gotCard) {
      grantCardReward();
    }
    
    if (state.pet) {
      const threshold = petExpThreshold();
      const expBonus = Math.max(1, Math.round(threshold * 0.1));
      state.pet.exp += expBonus;
      console.log('✨ 퀴즈 정답! 포켓몬 경험치 +' + expBonus);
      const result = checkPetLevelUp();
      if (result.evolved) {
        state.pet.justEvolved = true;
        saveState();
        renderPetTab();
      }
      saveState();
      renderPetTab();
    }
    
  } else {
    fb.textContent = '❌ 정답은 "' + currentQuiz.questions[currentQuiz.currentIndex].correctAnswer + '"';
    fb.className = 'quiz-feedback no';
  }
  
  document.getElementById('quizArt')?.classList.remove('silhouette');
  updateStatline();
  
  setTimeout(() => {
    currentQuiz.currentIndex++;
    renderQuizMission();
  }, 1500);
}

// ===== 🧮 수학퀴즈 =====
function renderPokemonIcons(pokemon, count, size = '40px') {
  const pokemonImg = pokemon && pokemon.image ? 
    `<img src="${pokemon.image}" alt="${pokemon.name}" style="width:${size};height:${size};object-fit:contain;display:inline-block;margin:2px;">` : 
    '❓';
  return Array(count).fill(pokemonImg).join('');
}

function generateOptions(answer, age) {
  let options = [answer];
  while (options.length < 4) {
    let offset = Math.floor(Math.random() * 5) + 1;
    if (Math.random() < 0.5) offset = -offset;
    const wrong = answer + offset;
    if (wrong >= 0 && !options.includes(wrong) && wrong !== answer) {
      options.push(wrong);
    }
  }
  return options.sort(() => Math.random() - 0.5);
}

function generateVisualMathQuestion(age) {
  const pokemon1 = POKEMON_LIST[Math.floor(Math.random() * POKEMON_LIST.length)];
  const pokemon2 = POKEMON_LIST[Math.floor(Math.random() * POKEMON_LIST.length)];
  
  let num1, num2, operation, answer;
  
  if (age <= 7) {
    num1 = Math.floor(Math.random() * 5) + 1;
    num2 = Math.floor(Math.random() * num1) + 1;
    operation = Math.random() < 0.5 ? '+' : '-';
    
    if (operation === '+') {
      answer = num1 + num2;
      return {
        question: `${pokemon1.name} ${num1}마리 + ${pokemon2.name} ${num2}마리 = ?`,
        visualLeft: renderPokemonIcons(pokemon1, num1),
        visualRight: renderPokemonIcons(pokemon2, num2),
        num1: num1,
        num2: num2,
        operation: '+',
        answer: answer,
        options: generateOptions(answer, age),
        pokemonName: pokemon1.name,
        pokemonType: pokemon1.type,
        pokemonEngName: pokemon1.engName,
        isVisual: true
      };
    } else {
      answer = num1 - num2;
      return {
        question: `${pokemon1.name} ${num1}마리 - ${pokemon2.name} ${num2}마리 = ?`,

        pokemonType: pokemon1.type,

  for (let i = 0; i < 10; i++) {
    let q;
    if (age <= 8) {
      q = generateVisualMathQuestion(age);
    } else {
      q = generateSingleMathQuestion(age);
    }
    questions.push(q);
  }
  
  state.mathQuiz = {
    today: key,
    questions: questions,
    currentIndex: 0,
    results: [],
    completed: false
  };
  saveState();
}

function checkMathAnswer2(selectedIdx) {
  const q = state.mathQuiz;
  if (!q || q.completed) return;
  
  const currentQ = q.questions[q.currentIndex];
  if (currentQ.answered) return;
  
  const buttons = document.querySelectorAll('.opt-btn');
  buttons.forEach(b => b.disabled = true);
  
  const isCorrect = currentQ.options[selectedIdx] === currentQ.answer;
  const fb = document.getElementById('mathFeedback');
  
  if (isCorrect) {
    buttons[selectedIdx].classList.add('correct');
    fb.textContent = '🎉 정답이에요! 대단해요!';
    fb.className = 'feedback ok';
    q.results.push(true);
    
    if (state.pet) {
      const threshold = petExpThreshold();
      const expBonus = Math.max(1, Math.round(threshold * 0.1));
      state.pet.exp += expBonus;
      console.log('🧮 수학퀴즈 정답! 포켓몬 경험치 +' + expBonus);
      const result = checkPetLevelUp();
      if (result.evolved) {
        state.pet.justEvolved = true;
        saveState();
        renderPetTab();
      }
      saveState();
      renderPetTab();
    }
    
    const gotCard = Math.random() * 100 < 15;
    if (gotCard) {
      grantCardReward();
    }
    
  } else {
    buttons[selectedIdx].classList.add('wrong');
    buttons.forEach((b, i) => {
      if (currentQ.options[i] === currentQ.answer) b.classList.add('correct');
    });
    fb.textContent = '❌ 정답은 ' + currentQ.answer + '였어요!';
    fb.className = 'feedback no';
    q.results.push(false);
  }
  
  currentQ.answered = true;
  state.mathStats.total = (state.mathStats.total || 0) + 1;
  if (isCorrect) state.mathStats.correct = (state.mathStats.correct || 0) + 1;
  saveState();
  updateStatline();
  
  setTimeout(() => {
    q.currentIndex++;
    if (q.currentIndex >= q.questions.length) {
      q.completed = true;
      saveState();
    }
    renderMathQuiz();
  }, 1500);
}

function renderRaidCardSelector() {
  const ownedCards = Object.keys(state.owned).filter(key => state.owned[key].count > 0);
  
  if (ownedCards.length === 0) {
    return '<div style="color:#8d84b0;font-size:14px;text-align:center;padding:10px;">보유한 카드가 없어요</div>';
  }
  
  const sortedCards = ownedCards.sort((a, b) => {
    const rarityOrder = { 'special': 5, 'ultra-rare': 4, 'super-rare': 3, 'rare': 2, 'common': 1 };
    return (rarityOrder[state.owned[b].rarity] || 0) - (rarityOrder[state.owned[a].rarity] || 0);
  });
  
  let html = '<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:6px;max-height:200px;overflow-y:auto;padding:4px;">';
  
  sortedCards.forEach(key => {
    const c = getPokemonByName(key);
    const info = state.owned[key];
    const rInfo = getRarityInfo(info.rarity);
    if (c) {
      html += `
        <div class="raid-card-select" data-key="${key}" style="border:3px solid ${rInfo.color};border-radius:10px;padding:6px;text-align:center;cursor:pointer;background:rgba(255,255,255,.05);">
          <div class="rds-art">${pokemonImage(c, '36px')}</div>
          <div class="rds-name">${c.name}</div>
          <div class="rds-rarity" style="color:${rInfo.color};">${rInfo.label}</div>
        </div>
      `;
    }
  });
  
  html += '</div>';
  html += `
    <div style="margin-top:6px;font-size:12px;color:#6b6395;text-align:center;">💡 등급 높은 순 · 클릭으로 선택</div>
    <div id="selectedRaidCardDisplay" style="margin-top:6px;font-size:16px;color:var(--sun-2);text-align:center;font-weight:700;">선택된 카드: 없음</div>
  `;
  
  return html;
}

function renderRaidMission() {
  const panel = document.getElementById('missionPanel');
  const key = todayKey();
  
  if (!state.raid || state.raid.today !== key) {
    const finalForms = POKEMON_LIST.filter(p => {
      const evoChain = getEvoChain(p.engName);
      return evoChain && evoChain.length >= 2 && evoChain[evoChain.length-1] === p.engName;
    });
    
    let boss;
    if (finalForms.length === 0) {
      boss = POKEMON_LIST[Math.floor(Math.random() * POKEMON_LIST.length)];
    } else {
      boss = finalForms[Math.floor(Math.random() * finalForms.length)];
    }
    
    state.raid = {
      boss: boss,
      hp: boss.hp * 15,
      maxHp: boss.hp * 15,
      completed: false,
      today: key,
      attackChance: 0,
      rewardCollected: false
    };
    saveState();
  }
  
  const raid = state.raid;
  const boss = raid.boss;
  
  if (!boss) {
    panel.innerHTML = `<div class="mission-intro"><div class="big-emoji">😅</div><div style="font-size:18px;">레이드 보스를 불러올 수 없어요</div></div>`;
    return;
  }
  
  if (raid.completed) {
    const alreadyCollected = raid.rewardCollected || false;
    panel.innerHTML = `
      <div class="mission-intro">
        <div class="big-emoji">🎉</div>
        <div style="font-size:24px;color:var(--special);font-family:var(--font-display);">레이드 클리어!</div>
        <div style="color:#B7AFDE;font-size:16px;margin-top:6px;">${boss.name}을(를) 물리쳤어요!</div>
        <div style="margin-top:12px;font-size:16px;color:${alreadyCollected ? '#8d84b0' : 'var(--good)'};">${alreadyCollected ? '✅ 이미 보상을 받았어요!' : '🎁 보상: ' + boss.name + ' (스페셜) 카드 획득!'}</div>
        ${!alreadyCollected ? `<button class="btn" onclick="collectRaidReward()" style="margin-top:14px;">🎁 보상 받기</button>` : ''}
      </div>
    `;
    return;
  }
  
  const hpPercent = Math.max(0, (raid.hp / raid.maxHp) * 100);
  const atkChance = raid.attackChance || 0;
  const cardSelectorHTML = renderRaidCardSelector();
  
  panel.innerHTML = `
    <div class="raid-boss">
      ${renderRaidBossInfo(boss)}
      
      <div class="boss-hp"><div style="width:${hpPercent}%"></div></div>
      <div class="boss-info">❤️ HP ${Math.max(0, Math.round(raid.hp))} / ${raid.maxHp}</div>
      
      <div style="margin-top:12px;text-align:left;font-size:14px;color:#B7AFDE;">
        <div>⚔️ 공격 기회: <b style="color:var(--sun-2);font-size:20px;">${atkChance}회</b></div>
        <div style="margin-top:6px;font-size:14px;">📤 공격할 카드 선택:</div>
        ${cardSelectorHTML}
      </div>
      
      <div style="display:flex;gap:10px;margin-top:12px;flex-wrap:wrap;justify-content:center;">
        <button class="btn" id="raidAttackBtn" ${atkChance > 0 ? '' : 'disabled'}>⚔️ 공격 (${atkChance}회)</button>
        <button class="btn small ghost" onclick="renderRaidMission()">🔄 새로고침</button>
      </div>
      <div style="font-size:13px;color:#6b6395;margin-top:6px;">💡 생활미션 완료 시 공격 기회 +1</div>
    </div>
  `;
  
  document.querySelectorAll('.raid-card-select').forEach(el => {
    el.addEventListener('click', function() {
      document.querySelectorAll('.raid-card-select').forEach(e => {
        e.style.border = '3px solid ' + getRarityInfo(state.owned[e.dataset.key]?.rarity || 'common').color;
        e.style.background = 'rgba(255,255,255,.05)';
        e.classList.remove('selected');
      });
      this.style.border = '4px solid var(--sun)';
      this.style.background = 'rgba(255,201,60,.15)';
      this.classList.add('selected');
      selectedRaidCard = this.dataset.key;
      document.getElementById('selectedRaidCardDisplay').textContent = '✅ ' + (getPokemonByName(selectedRaidCard)?.name || '없음');
    });
  });
  
  document.getElementById('raidAttackBtn')?.addEventListener('click', function() {
    doRaidAttack();
  });
}

function doRaidAttack() {
  const raid = state.raid;
  if (!raid || raid.completed || !raid.boss) return;
  if ((raid.attackChance || 0) <= 0) {
    alert('공격 기회가 없어요! 생활미션을 완료해주세요.');
    return;
  }
  
  if (!selectedRaidCard) {
    alert('공격할 카드를 선택해주세요!');
    return;
  }
  
  const selectedCard = getPokemonByName(selectedRaidCard);
  if (!selectedCard) {
    alert('선택한 카드를 찾을 수 없어요!');
    return;
  }
  
  const rarityBonus = getRarityDamageBonus(state.owned[selectedRaidCard]?.rarity);
  const baseAtk = selectedCard.atk || 20;
  const randomBonus = Math.floor(Math.random() * 15) + 5;
  const damage = Math.max(10, Math.floor(baseAtk * 0.7 + rarityBonus + randomBonus));
  
  const mult = getEffMult(selectedCard.type, raid.boss.type);
  const finalDamage = Math.floor(damage * mult);
  
  raid.hp = Math.max(0, raid.hp - finalDamage);
  raid.attackChance = (raid.attackChance || 0) - 1;
  
  saveState();
  
  if (raid.hp <= 0) {
    raid.completed = true;
    raid.rewardCollected = false;
    saveState();
    alert(`🎉 ${raid.boss.name}을(를) 물리쳤어요! 레이드 탭에서 보상을 받아주세요!`);
    renderRaidMission();
  } else {
    const effMsg = mult > 1 ? ' (효과 굉장!)' : mult < 1 ? ' (효과 별로...)' : '';
    alert(`⚔️ ${selectedCard.name}의 공격! ${finalDamage}의 데미지!${effMsg}\n남은 HP: ${Math.round(raid.hp)}`);
    renderRaidMission();
  }
}

function collectRaidReward() {
  const raid = state.raid;
  if (!raid || !raid.completed || !raid.boss) {
    alert('레이드를 먼저 클리어해주세요!');
    return;
  }
  
  if (raid.rewardCollected) {
    alert('이미 보상을 받았어요!');
    return;
  }
  
  const boss = raid.boss;
  const rarity = 'special';
  
  if (!state.owned[boss.engName]) {
    state.owned[boss.engName] = { count: 1, rarity: rarity };
  } else {
    state.owned[boss.engName].count += 1;
  }
  
  raid.rewardCollected = true;
  saveState();
  
  showRewardPopup(boss, '🎉 레이드 보상 획득!', '스페셜 등급!');
  
  updateStatline();
  saveState();
  renderDex();
  renderRaidMission();
}

// ===== 키우기 =====
function petCreature() {
  if (!state.pet) return null;
  // pet.evolvedId가 있으면 그대로 사용, 없으면 baseId 사용
  const id = state.pet.evolvedId || state.pet.baseId;
  return getPokemonByName(id);
}

function tickPet() {
  if (!state.pet) return;
  const now = Date.now();
  const hours = (now - state.pet.lastUpdate) / 3600000;
  if (hours > 0.02) {
    const decay = hours * 4;
    state.pet.hunger = clamp(state.pet.hunger - decay, 0, 100);
    state.pet.happy = clamp(state.pet.happy - decay * 0.8, 0, 100);
    state.pet.energy = clamp(state.pet.energy - decay * 0.6, 0, 100);
    state.pet.lastUpdate = now;
    saveState();
  }
}

function petExpThreshold() { return state.pet.level * 25; }

// ===== 🔥 진화 체크 (수정됨 - EVOLUTION_MAP 사용) =====
function checkPetLevelUp() {
  let leveled = false, evolved = false;
  let evoMessage = '';
  let evoPokemon = null;
  
  while (state.pet.exp >= petExpThreshold()) {
    state.pet.exp -= petExpThreshold();
    state.pet.level++;
    leveled = true;
    console.log('📈 레벨업! 현재 레벨:', state.pet.level);
    
    // 현재 포켓몬 ID (진화된 경우 evolvedId 사용)
    const currentId = state.pet.evolvedId || state.pet.baseId;
    const evoInfo = EVOLUTION_MAP[currentId];
    
    // 진화 조건 체크
    if (evoInfo && evoInfo.next && state.pet.level >= evoInfo.level) {
      // 이미 진화했는지 체크 (중복 진화 방지)
      if (state.pet.evolvedId !== evoInfo.next) {
        const nextPokemon = getPokemonByName(evoInfo.next);
        if (nextPokemon) {
          console.log('🎉 진화! ' + currentId + ' → ' + evoInfo.next + ' (Lv.' + evoInfo.level + ')');
          
          // 진화 처리
          state.pet.evolvedId = evoInfo.next;
          // 진화 단계 표시 (일반 진화는 true로)
          if (!state.pet.evolved) state.pet.evolved = true;
          
          evolved = true;
          evoPokemon = nextPokemon;
          evoMessage = '🎉 ' + nextPokemon.name + '(으)로 진화했어요!';
          
          // 진화한 포켓몬 카드 획득
          const rarity = rollRarity();
          if (!state.owned[nextPokemon.engName]) {
            state.owned[nextPokemon.engName] = { count: 1, rarity: rarity };
          } else {
            state.owned[nextPokemon.engName].count += 1;
          }
          
          // 진화 팝업 표시
          showRewardPopup(nextPokemon, evoMessage, '진화 성공! 🌟');
          
          saveState();
          renderDex();
          renderPetTab();
        }
      }
    }
  }
  
  return { leveled, evolved };
}

function petAction(statKey, statAmt, expKey, expAmt) {
  state.pet[statKey] = clamp(state.pet[statKey] + statAmt, 0, 100);
  state.pet[expKey] = state.pet[expKey] + expAmt;
  const result = checkPetLevelUp();
  if (result.evolved) {
    state.pet.justEvolved = true;
  }
  saveState();
  // 중복 렌더링 방지: 진화 시에는 checkPetLevelUp()에서 renderPetTab()을 호출하므로 여기서는 호출하지 않음
  if (!result.evolved) {
    renderPetTab();
  }
}

function isOnCooldown(lastAction, cooldownMs) {
  if (!lastAction) return false;
  return Date.now() - lastAction < cooldownMs;
}

function getCooldownRemaining(lastAction, cooldownMs) {
  if (!lastAction) return 0;
  const elapsed = Date.now() - lastAction;
  return Math.max(0, cooldownMs - elapsed);
}

async function openCardDetail(pokemon) {

  const ownedData = state.owned[pokemon.engName];

  let moves = [];
  let evoChain = [];

    if (pokemon.speciesUrl) {
      const speciesRes = await fetch(pokemon.speciesUrl);
      const speciesData = await speciesRes.json();
      
      const flavor = speciesData.flavor_text_entries?.find(f => f.language.name === 'ko');
      if (flavor) description = flavor.flavor_text;
      
      const detailRes = await fetch('https://pokeapi.co/api/v2/pokemon/' + pokemon.engName);

      abilities = detail.abilities.map(a => getAbilityKorean(a.ability.name));

          }).join('')}
        </div>
      </div>
    `;
  }
  
  body.innerHTML = `

    <div class="modal-name">${pokemon.name}</div>
    <div class="modal-types">

function closeModal() {
  if (window.speechSynthesis) window.speechSynthesis.cancel();
  if (modalCryAudio) { modalCryAudio.pause(); modalCryAudio = null; }
  document.getElementById('cardModal').classList.remove('open');
}

function extractEvoChain(chain) {
  const result = [];
  let current = chain;
  
  while (current) {
    const speciesName = current.species.name;
    const pokemon = getPokemonByName(speciesName);
    const evoDetail = current.evolution_details?.[0] || {};
    const level = evoDetail.min_level || evoDetail.min_happiness || null;
    
    result.push({
      name: pokemon ? pokemon.name : speciesName,
      image: pokemon ? pokemon.image : null,
      level: level
    });
    
    if (current.evolves_to && current.evolves_to.length > 0) {
      current = current.evolves_to[0];
    } else {
      break;
    }
  }
  
  return result;
}

function renderBattleSetup() {
  const slots = document.getElementById('teamSlots');
  slots.innerHTML = '';
  for (let i = 0; i < 3; i++) {
    const engName = state.team[i];
    const c = engName ? getPokemonByName(engName) : null;
    const div = document.createElement('div');
    div.className = 'slot' + (c ? ' filled' : '');
    div.innerHTML = c
      ? `<span class="x" data-remove="${i}">✕</span><div class="mini-art">${pokemonImage(c)}</div>`
      : `<span style="font-family:var(--font-mono);font-size:14px;color:#8d84b0;">+ 선택</span>`;
    div.addEventListener('click', function(e) {
      if (e.target.dataset.remove !== undefined && e.target.dataset.remove !== '') {
        state.team[i] = null;
        state.team = state.team.filter(x => x);
        saveState();
        renderBattleSetup();
        return;
      }
      openPicker(i);
    });
    slots.appendChild(div);
  }
  document.getElementById('battleBody').innerHTML = '';
  if (state.team.filter(x => x).length === 3) {
    if (battleMode === 'pvp') renderPvpIntro();
    else renderAiIntro();
  } else {
    document.getElementById('battleBody').innerHTML = `<div class="empty-note">카드 3장을 골라주세요</div>`;
  }
}

function openPicker(slotIndex) {
  const picker = document.getElementById('picker');
  const owned = ownedList();
  if (owned.length === 0) {
    document.getElementById('battleBody').innerHTML = `<div class="empty-note">보유한 카드가 없어요</div>`;
    return;
  }
  picker.classList.add('open');
  document.getElementById('pickGrid').innerHTML = owned.map(c => {
    const already = state.team.includes(c.engName);
    return `<div class="pick-item ${already ? 'disabled' : ''}" data-id="${c.engName}">${pokemonImage(c)}<div class="n">${c.name}</div></div>`;
  }).join('');
  document.querySelectorAll('.pick-item').forEach(el => {
    el.addEventListener('click', function() {
      state.team[slotIndex] = this.dataset.id;
      picker.classList.remove('open');
      saveState();
      renderBattleSetup();
    });
  });
}

// ===== AI 배틀 =====
let aiBattle = null;
function makeEnemyTeam() {
  const pool = POKEMON_LIST.filter(c => state.owned[c.engName]);
  const team = [];
  const shuffled = [...pool].sort(() => Math.random() - 0.5);
  for (let i = 0; i < 3 && i < shuffled.length; i++) {
    team.push({ ...shuffled[i], curHp: shuffled[i].hp });
  }
  while (team.length < 3) {
    const c = POKEMON_LIST[Math.floor(Math.random() * POKEMON_LIST.length)];
    if (!team.find(t => t.engName === c.engName)) {
      team.push({ ...c, curHp: c.hp });
    }
  }
  return team;
}

function renderAiIntro() {
  document.getElementById('battleBody').innerHTML = `<div style="text-align:center;margin-top:6px;"><button class="btn" id="startAiBtn">연습 배틀 시작</button></div>`;
  document.getElementById('startAiBtn').addEventListener('click', function() {
    const playerTeam = state.team.map(engName => {
      const c = getPokemonByName(engName);
      return c ? { ...c, curHp: c.hp } : null;
    }).filter(Boolean);
    aiBattle = { player: playerTeam, enemy: makeEnemyTeam(), pActive: 0, eActive: 0, log: [], over: false };
    addAiLog('상대 트레이너가 나타났다!', 'sys');
    renderAiArena();
  });
}

function addAiLog(t, c) {
  if (!c) c = '';
  aiBattle.log.unshift(`<p class="${c}">${t}</p>`);
  if (aiBattle.log.length > 40) aiBattle.log.pop();
}

function renderAiArena() {
  const p = aiBattle.player[aiBattle.pActive];
  const e = aiBattle.enemy[aiBattle.eActive];
  document.getElementById('battleBody').innerHTML = `
    <div class="arena">
      <div class="vs-row">
        <div class="fighter"><div class="art-wrap">${pokemonImage(p)}</div><div class="fname">${p.name}</div>
          <div class="hpbar ${p.curHp / p.hp < 0.3 ? 'low' : ''}"><div style="width:${Math.max(0, p.curHp / p.hp * 100)}%"></div></div>
          <div class="hptext">${Math.max(0, p.curHp)} / ${p.hp}</div></div>
        <div class="vs-seal">VS</div>
        <div class="fighter"><div class="art-wrap">${pokemonImage(e)}</div><div class="fname">${e.name}</div>
          <div class="hpbar ${e.curHp / e.hp < 0.3 ? 'low' : ''}"><div style="width:${Math.max(0, e.curHp / e.hp * 100)}%"></div></div>
          <div class="hptext">${Math.max(0, e.curHp)} / ${e.hp}</div></div>
      </div>
      <div class="log">${aiBattle.log.join('')}</div>
      <div class="battle-actions">${aiBattle.over ? `<button class="btn" id="endAiBtn">팀 다시 구성</button>` : `<button class="btn" id="attackAiBtn">⚔️ 공격</button>`}</div>
    </div>`;
  if (aiBattle.over) {
    document.getElementById('endAiBtn').addEventListener('click', function() { aiBattle = null; renderBattleSetup(); });
  } else {
    document.getElementById('attackAiBtn').addEventListener('click', doAiTurn);
  }
}

function doAiTurn() {
  const p = aiBattle.player[aiBattle.pActive];
  const e = aiBattle.enemy[aiBattle.eActive];
  const order = p.spd >= e.spd ? ['p', 'e'] : ['e', 'p'];
  for (const side of order) {
    if (aiBattle.over) break;
    if (side === 'p') {
      if (p.curHp <= 0) continue;
      const mult = getEffMult(p.type, e.type);
      const rarityBonus = getRarityDamageBonus(state.owned[p.engName]?.rarity);
      const dmg = Math.max(3, Math.round(p.atk * mult - e.def * 0.35) + rarityBonus);
      e.curHp -= dmg;
      addAiLog(p.name + '의 공격! ' + e.name + '에게 ' + dmg + ' 피해' + (mult > 1 ? ' (효과 굉장!)' : mult < 1 ? ' (효과 별로...)' : ''), mult > 1 ? 'eff' : mult < 1 ? 'bad' : '');
      if (e.curHp <= 0) {
        addAiLog(e.name + ' 쓰러짐!', 'sys');
        const next = aiBattle.enemy.findIndex((c, i) => i > aiBattle.eActive && c.curHp > 0);
        if (next === -1) { endAiBattle(true); break; }
        aiBattle.eActive = next;
        addAiLog('상대가 ' + aiBattle.enemy[next].name + '을(를) 내보냈다!', 'sys');
      }
    } else {
      const ee = aiBattle.enemy[aiBattle.eActive];
      if (ee.curHp <= 0) continue;
      const mult = getEffMult(ee.type, p.type);
      const dmg = Math.max(3, Math.round(ee.atk * mult - p.def * 0.35));
      p.curHp -= dmg;
      addAiLog(ee.name + '의 공격! ' + p.name + '에게 ' + dmg + ' 피해' + (mult > 1 ? ' (효과 굉장!)' : mult < 1 ? ' (효과 별로...)' : ''), mult > 1 ? 'bad' : mult < 1 ? 'eff' : '');
      if (p.curHp <= 0) {
        addAiLog(p.name + ' 쓰러짐!', 'sys');
        const next = aiBattle.player.findIndex((c, i) => i > aiBattle.pActive && c.curHp > 0);
        if (next === -1) { endAiBattle(false); break; }
        aiBattle.pActive = next;
        addAiLog(aiBattle.player[next].name + '을(를) 내보냈다!', 'sys');
      }
    }
  }
  renderAiArena();
}

function endAiBattle(playerWon) {
  aiBattle.over = true;
  if (playerWon) { state.wins++; addAiLog('승리! 🎉', 'eff'); }
  else { state.losses++; addAiLog('패배...', 'bad'); }
  updateStatline(); saveState();
}

function renderPvpIntro() {
  document.getElementById('battleBody').innerHTML = `
    <div class="room-box">
      <div style="font-family:var(--font-mono);font-size:13px;color:#B7AFDE;">Firebase로 친구와 실시간 배틀!</div>
      <div style="display:flex;gap:8px;margin-top:12px;flex-wrap:wrap;justify-content:center;">
        <button class="btn block" id="createRoomBtn" style="flex:1;min-width:100px;font-size:16px;padding:14px;">🚀 방 만들기</button>
      </div>
      <div style="margin:12px 0 4px;font-family:var(--font-mono);font-size:12px;color:#8d84b0;">— 또는 —</div>
      <input class="room-input" id="joinCodeInput" maxlength="4" inputmode="numeric" placeholder="0000">
      <button class="btn ghost block" id="joinRoomBtn">코드로 참가</button>
      <div class="quiz-feedback" id="pvpFeedback" style="margin-top:8px;"></div>
    </div>`;
  document.getElementById('createRoomBtn').addEventListener('click', createBattleRoom);
  document.getElementById('joinRoomBtn').addEventListener('click', function() {
    const code = document.getElementById('joinCodeInput').value.trim();
    if (code.length !== 4) { setPvpFeedback('4자리 코드를 입력해주세요', true); return; }
    joinBattleRoom(code);
  });
}

function setPvpFeedback(msg, bad) {
  const el = document.getElementById('pvpFeedback');
  if (el) { el.textContent = msg; el.className = 'quiz-feedback ' + (bad ? 'no' : 'ok'); }
}

async function createBattleRoom() {
  if (state.team.filter(x => x).length < 3) {
    setPvpFeedback('배틀 팀을 먼저 구성해주세요! (3장 필요)', true);
    return;
  }
  
  const code = String(Math.floor(1000 + Math.random() * 9000));
  const team = state.team.map(engName => {
    const c = getPokemonByName(engName);
    return c ? { ...c, curHp: c.hp } : null;
  }).filter(Boolean);
  
  const roomData = {
    host: team,
    guest: null,
    turn: 'host',
    status: 'waiting',
    log: ['🔵 방이 생성됐어요! 친구를 기다리는 중...'],
    createdAt: Date.now(),
    winner: null
  };
  
  try {
    await db.ref('battles/' + code).set(roomData);
    myBattleRoom = { code, side: 'host' };
    setPvpFeedback('✅ 방 생성! 코드: ' + code, false);
    setupBattleListener(code);
    showWaitingRoom(code);
  } catch (e) {
    setPvpFeedback('방 생성 실패: ' + e.message, true);
  }
}

async function joinBattleRoom(code) {
  if (state.team.filter(x => x).length < 3) {
    setPvpFeedback('배틀 팀을 먼저 구성해주세요! (3장 필요)', true);
    return;
  }
  
  try {
    const snapshot = await db.ref('battles/' + code).once('value');
    const room = snapshot.val();
    
    if (!room) {
      setPvpFeedback('코드를 찾을 수 없어요', true);
      return;
    }
    
    if (room.status !== 'waiting' || room.guest) {
      setPvpFeedback('이미 배틀이 진행 중인 방이에요', true);
      return;
    }
    
    const team = state.team.map(engName => {
      const c = getPokemonByName(engName);
      return c ? { ...c, curHp: c.hp } : null;
    }).filter(Boolean);
    
    await db.ref('battles/' + code).update({
      guest: team,
      status: 'active',
      turn: 'host',
      log: ['🟢 친구가 참가했어요! 배틀 시작!']
    });
    
    myBattleRoom = { code, side: 'guest' };
    setPvpFeedback('✅ 배틀에 참가했어요!', false);
    setupBattleListener(code);
    showWaitingRoom(code);
  } catch (e) {
    setPvpFeedback('참가 실패: ' + e.message, true);
  }
}

function setupBattleListener(code) {
  if (battleListener) {
    try { battleListener.off(); } catch(e) {}
    battleListener = null;
  }
  
  battleListener = db.ref('battles/' + code);
  battleListener.on('value', function(snapshot) {
    const room = snapshot.val();
    if (!room) {
      document.getElementById('battleBody').innerHTML = '<div class="empty-note">방이 사라졌어요</div>';
      return;
    }
    
    if (room.status === 'waiting') {
      showWaitingRoom(code);
    } else {
      renderBattleArena(room);
    }
  });
}

function showWaitingRoom(code) {
  document.getElementById('battleBody').innerHTML = `
    <div class="room-box">
      <div style="font-family:var(--font-mono);font-size:12px;color:#B7AFDE;">친구에게 이 코드를 알려주세요</div>
      <div class="room-code">${code}</div>
      <div style="font-family:var(--font-mono);font-size:14px;color:var(--sun-2);" class="waiting-dots">친구를 기다리는 중</div>
      <button class="btn ghost small" id="cancelRoomBtn" style="margin-top:12px;">방 나가기</button>
    </div>`;
  document.getElementById('cancelRoomBtn').addEventListener('click', leaveBattleRoom);
}

function renderBattleArena(room) {
  if (!myBattleRoom) return;
  
  const mySide = myBattleRoom.side;
  const oppSide = mySide === 'host' ? 'guest' : 'host';
  const me = room[mySide];
  const opp = room[oppSide];
  
  if (!me || !opp) {
    document.getElementById('battleBody').innerHTML = '<div class="empty-note">상대방이 아직 팀을 선택하지 않았어요...</div>';
    return;
  }
  
  const myPokemon = me[0];
  const oppPokemon = opp[0];
  const myTurn = room.turn === mySide;
  const isFinished = room.status === 'finished';
  
  document.getElementById('battleBody').innerHTML = `
    <div class="arena">
      <div class="vs-row">
        <div class="fighter">
          <div class="art-wrap">${pokemonImage(myPokemon)}</div>
          <div class="fname">${myPokemon.name}</div>
          <div class="hpbar ${myPokemon.curHp / myPokemon.hp < 0.3 ? 'low' : ''}">
            <div style="width:${Math.max(0, myPokemon.curHp / myPokemon.hp * 100)}%"></div>
          </div>
          <div class="hptext">${Math.max(0, myPokemon.curHp)} / ${myPokemon.hp}</div>
        </div>
        <div class="vs-seal">VS</div>
        <div class="fighter">
          <div class="art-wrap">${pokemonImage(oppPokemon)}</div>
          <div class="fname">${oppPokemon.name}</div>
          <div class="hpbar ${oppPokemon.curHp / oppPokemon.hp < 0.3 ? 'low' : ''}">
            <div style="width:${Math.max(0, oppPokemon.curHp / oppPokemon.hp * 100)}%"></div>
          </div>
          <div class="hptext">${Math.max(0, oppPokemon.curHp)} / ${oppPokemon.hp}</div>
        </div>
      </div>
      
      ${isFinished ? `
        <div class="turn-banner" style="font-size:18px;">
          ${room.winner === mySide ? '🎉 승리!' : room.winner === oppSide ? '아쉬워요...' : '무승부!'}
        </div>
      ` : `
        <div class="turn-banner">${myTurn ? '🔥 내 차례! 공격!' : '⏳ 상대 차례...'}</div>
      `}
      
      <div class="log">
        ${room.log && room.log.length > 0 ? room.log.map(t => '<p>' + t + '</p>').join('') : '<p>배틀 시작!</p>'}
      </div>
      
      <div class="battle-actions">
        ${isFinished ? `
          <button class="btn" id="exitBattleBtn">방 나가기</button>
        ` : `
          <button class="btn" id="attackBtn" ${myTurn && !isFinished ? '' : 'disabled'}>⚔️ 공격</button>
          <button class="btn ghost small" id="exitBattleBtn2">나가기</button>
        `}
      </div>
    </div>
  `;
  
  if (isFinished) {
    document.getElementById('exitBattleBtn').addEventListener('click', leaveBattleRoom);
    if (room.winner === mySide && !room._counted) {
      state.wins++;
      updateStatline();
      saveState();
      db.ref('battles/' + myBattleRoom.code).update({ _counted: true });
    }
  } else {
    document.getElementById('attackBtn')?.addEventListener('click', doBattleAttack);
    document.getElementById('exitBattleBtn2')?.addEventListener('click', leaveBattleRoom);
  }
}

async function doBattleAttack() {
  if (!myBattleRoom) return;
  
  const code = myBattleRoom.code;
  const mySide = myBattleRoom.side;
  const oppSide = mySide === 'host' ? 'guest' : 'host';
  
  try {
    const snapshot = await db.ref('battles/' + code).once('value');
    const room = snapshot.val();
    
    if (!room || room.status === 'finished') return;
    if (room.turn !== mySide) return;
    
    const me = room[mySide];
    const opp = room[oppSide];
    
    if (!me || !opp) return;
    
    const myPokemon = me[0];
    const oppPokemon = opp[0];
    
    const mult = getEffMult(myPokemon.type, oppPokemon.type);
    const rarityBonus = getRarityDamageBonus(state.owned[myPokemon.engName]?.rarity);
    const dmg = Math.max(3, Math.round(myPokemon.atk * mult - oppPokemon.def * 0.35) + rarityBonus);
    oppPokemon.curHp = Math.max(0, oppPokemon.curHp - dmg);
    
    let logMsg = myPokemon.name + '의 공격! ' + oppPokemon.name + '에게 ' + dmg + ' 피해';
    if (mult > 1) logMsg += ' (효과 굉장!)';
    else if (mult < 1) logMsg += ' (효과 별로...)';
    
    let nextTurn = oppSide;
    if (oppPokemon.curHp <= 0) {
      logMsg += ' → ' + oppPokemon.name + ' 쓰러짐!';
      const nextIdx = opp.findIndex((p, i) => i > 0 && p.curHp > 0);
      if (nextIdx === -1) {
        await db.ref('battles/' + code).update({
          status: 'finished',
          winner: mySide,
          log: [logMsg, ...(room.log || [])]
        });
        return;
      } else {
        const nextPokemon = opp[nextIdx];
        opp[0] = nextPokemon;
        opp.splice(nextIdx, 1);
        logMsg += ' → 상대가 ' + nextPokemon.name + '을(를) 내보냈다!';
        nextTurn = oppSide;
      }
    } else {
      nextTurn = oppSide;
    }
    
    await db.ref('battles/' + code).update({
      [mySide]: me,
      [oppSide]: opp,
      turn: nextTurn,
      log: [logMsg, ...(room.log || [])]
    });
    
  } catch (e) {
    console.error('공격 실패:', e);
    setPvpFeedback('공격 중 오류가 발생했어요', true);
  }
}

function leaveBattleRoom() {
  if (battleListener) {
    try { battleListener.off(); } catch(e) {}
    battleListener = null;
  }
  
  if (myBattleRoom) {
    if (myBattleRoom.side === 'host') {
      db.ref('battles/' + myBattleRoom.code).remove().catch(() => {});
    }
    myBattleRoom = null;
  }
  
  document.getElementById('battleBody').innerHTML = '<div class="empty-note">배틀에서 나갔어요</div>';
  setTimeout(() => renderBattleSetup(), 500);
}

    </div>
    
    <button class="btn small ghost block" style="margin-top:8px;" onclick="leaveTradeRoom(); renderTradeTab();">방 나가기</button>
  `;
  
  document.getElementById('createTradeBtn').addEventListener('click', createTradeRoom);
  document.getElementById('joinTradeBtn').addEventListener('click', function() {
    const code = document.getElementById('tradeCodeInput').value.trim();
    if (code.length !== 4) {
      alert('4자리 코드를 입력해주세요!');
      return;
    }
    joinTradeRoom(code);
  });
  document.getElementById('sendTradeBtn').addEventListener('click', sendTradeRequest);
  document.getElementById('confirmTradeBtn').addEventListener('click', confirmTrade);
}

// ===== 교환 함수들 =====
async function createTradeRoom() {
  const code = String(Math.floor(1000 + Math.random() * 9000));
  
  const roomData = {
    host: { id: 'host', card: null, ready: false, confirmed: false },
    guest: null,
    status: 'waiting',
    log: ['🔵 교환방이 생성됐어요! 친구를 기다리는 중...'],
    createdAt: Date.now(),
    completed: false
  };
  
  try {
    await db.ref('trades/' + code).set(roomData);
    myTradeRoom = { code, side: 'host' };
    
    const statusEl = document.getElementById('tradeStatus');
    statusEl.style.display = 'block';
    statusEl.innerHTML = `
      <div style="color:var(--sun-2);">✅ 교환방 생성! 코드: <strong>${code}</strong></div>
      <div style="font-size:12px;color:#B7AFDE;" class="waiting-dots">친구를 기다리는 중...</div>
    `;
    document.getElementById('sendTradeBtn').disabled = false;
    document.getElementById('confirmTradeBtn').style.display = 'none';
    updateTradeUI2('⏳ 친구를 기다리는 중...', 'waiting');
    
    setupTradeListener2(code);
  } catch (e) {
    alert('❌ 방 생성 실패: ' + e.message);
  }
}

async function joinTradeRoom(code) {
  try {
    const snapshot = await db.ref('trades/' + code).once('value');
    const room = snapshot.val();
    
    if (!room) {
      alert('코드를 찾을 수 없어요!');
      return;
    }
    
    if (room.status !== 'waiting' || room.guest) {
      alert('이미 교환이 진행 중인 방이에요');
      return;
    }
    
    await db.ref('trades/' + code).update({
      guest: { id: 'guest', card: null, ready: false, confirmed: false },
      status: 'ready',
      log: ['🟢 친구가 참가했어요! 카드를 선택해주세요!']
    });
    
    myTradeRoom = { code, side: 'guest' };
    
    const statusEl = document.getElementById('tradeStatus');
    statusEl.style.display = 'block';
    statusEl.innerHTML = `
      <div style="color:var(--sun-2);">✅ 교환방에 참가했어요!</div>
      <div style="font-size:12px;color:#B7AFDE;">코드: ${code}</div>
    `;
    document.getElementById('sendTradeBtn').disabled = false;
    document.getElementById('confirmTradeBtn').style.display = 'none';
    updateTradeUI2('✅ 참가 완료! 카드를 선택해주세요.', 'ready');
    
    setupTradeListener2(code);
  } catch (e) {
    alert('❌ 참가 실패: ' + e.message);
  }
}

function setupTradeListener2(code) {
  if (tradeListener) {
    try { tradeListener.off(); } catch(e) {}
    tradeListener = null;
  }
  
  try {
    tradeListener = db.ref('trades/' + code);
    tradeListener.on('value', function(snapshot) {
      try {
        const room = snapshot.val();
        if (!room) {
          document.getElementById('tradePartnerInfo').innerHTML = '❌ 방이 사라졌어요';
          return;
        }
        
        const mySide = myTradeRoom.side;
        const oppSide = mySide === 'host' ? 'guest' : 'host';
        const me = room[mySide];
        const opp = room[oppSide];
        
        if (opp) {
          const oppCard = opp.card ? getPokemonByName(opp.card) : null;
          document.getElementById('tradePartnerInfo').innerHTML = `
            <div style="display:flex;justify-content:space-between;align-items:center;font-size:13px;">
              <span>👤 ${mySide === 'host' ? '게스트' : '호스트'}</span>
              <span>${oppCard ? '📤 ' + oppCard.name + ' (선택됨)' : '⏳ 카드 선택 중...'}</span>
              <span>${opp.ready ? '✅ 준비 완료' : '⏳ 대기 중'}</span>
              ${opp.confirmed ? '<span style="color:var(--good);">✅ 최종 확인 완료</span>' : ''}
            </div>
          `;
        } else {
          document.getElementById('tradePartnerInfo').innerHTML = '👤 아직 참가자가 없어요';
        }
        
        const status = room.status;
        
        if (status === 'ready') {
          if (me && me.card && opp && opp.card) {
            document.getElementById('sendTradeBtn').style.display = 'none';
            document.getElementById('confirmTradeBtn').style.display = 'block';
            
            if (me.confirmed) {
              document.getElementById('confirmTradeBtn').disabled = true;
              document.getElementById('confirmTradeBtn').textContent = '⏳ 확인 완료 (상대방 대기 중)';
              updateTradeUI2('⏳ 상대방의 최종 확인을 기다리는 중...', 'confirm');
            } else {
              document.getElementById('confirmTradeBtn').disabled = false;
              document.getElementById('confirmTradeBtn').textContent = '✅ 최종 교환';
              updateTradeUI2('✅ 양쪽 모두 카드를 선택했어요! "최종 교환"을 눌러주세요.', 'confirm');
            }
          } else {
            document.getElementById('sendTradeBtn').style.display = 'block';
            document.getElementById('confirmTradeBtn').style.display = 'none';
            updateTradeUI2('⏳ 상대방이 카드를 선택하는 중...', 'ready');
          }
        } else if (status === 'confirm') {
          document.getElementById('sendTradeBtn').style.display = 'none';
          document.getElementById('confirmTradeBtn').style.display = 'block';
          
          if (me.confirmed) {
            document.getElementById('confirmTradeBtn').disabled = true;
            document.getElementById('confirmTradeBtn').textContent = '⏳ 확인 완료 (상대방 대기 중)';
            updateTradeUI2('⏳ 상대방의 최종 확인을 기다리는 중...', 'confirm');
          } else {
            document.getElementById('confirmTradeBtn').disabled = false;
            document.getElementById('confirmTradeBtn').textContent = '✅ 최종 교환 (상대방 확인 완료!)';
            updateTradeUI2('🔥 상대방이 확인했어요! "최종 교환"을 눌러주세요.', 'confirm');
          }
        } else if (status === 'completed') {
          document.getElementById('sendTradeBtn').style.display = 'none';
          document.getElementById('confirmTradeBtn').style.display = 'none';
          updateTradeUI2('✅ 교환이 완료되었어요! 🎉', 'completed');
          document.getElementById('tradePartnerInfo').innerHTML = '✅ 교환 완료!';
          
          if (room.exchangeResult && !room.exchangeResult._applied) {
            const result = room.exchangeResult;
            const myReceivedCard = mySide === 'host' ? result.oppCard : result.myCard;
            const myReceivedRarity = mySide === 'host' ? result.oppRarity : result.myRarity;
            const mySentCard = mySide === 'host' ? result.myCard : result.oppCard;
            
            if (state.owned[mySentCard] && state.owned[mySentCard].count > 0) {
              state.owned[mySentCard].count -= 1;
              if (state.owned[mySentCard].count <= 0) {
                delete state.owned[mySentCard];
              }
            }
            
            if (!state.owned[myReceivedCard]) {
              state.owned[myReceivedCard] = { count: 1, rarity: myReceivedRarity };
            } else {
              state.owned[myReceivedCard].count += 1;
            }
            
            result._applied = true;
            saveState();
            renderDex();
            updateStatline();
            
            const pokemon = getPokemonByName(myReceivedCard);
            alert(`✅ 교환 완료! ${pokemon ? pokemon.name : myReceivedCard} 카드를 받았어요! (${getRarityInfo(myReceivedRarity).label} 등급)`);
          }
        }
      } catch (e) {
        console.error('교환 리스너 처리 오류:', e);
      }
    }, function(error) {
      console.error('Firebase 읽기 오류:', error);
    });
    
    console.log('✅ 교환 리스너 등록 완료:', code);
    
  } catch (e) {
    console.error('리스너 등록 실패:', e);
  }
}

function updateTradeUI2(message, status) {
  const el = document.getElementById('tradeStatusDisplay');
  if (!el) return;
  
  const statusColors = {
    'waiting': '#B7AFDE',
    'ready': '#FFC93C',
    'confirm': '#FF6B35',
    'completed': '#4CAF7D'
  };
  
  el.innerHTML = message;
  el.style.color = statusColors[status] || '#B7AFDE';
  el.style.border = '2px solid ' + (statusColors[status] || 'transparent');
}

async function sendTradeRequest() {
  if (!myTradeRoom) {
    alert('먼저 교환방에 참가해주세요!');
    return;
  }
  
  const fromKey = document.getElementById('tradeCardSelect').value;
  if (!state.owned[fromKey] || state.owned[fromKey].count < 1) {
    alert('보낼 카드가 없어요!');
    return;
  }
  
  try {
    const roomRef = db.ref('trades/' + myTradeRoom.code);
    const snapshot = await roomRef.once('value');
    const room = snapshot.val();
    
    if (room.completed || room.status === 'completed') {
      alert('이미 교환이 완료되었어요!');
      return;
    }
    
    const updateData = {};
    updateData[myTradeRoom.side + '/card'] = fromKey;
    updateData[myTradeRoom.side + '/ready'] = true;
    updateData.log = ['📤 ' + getPokemonByName(fromKey)?.name + ' 카드를 선택했어요!'].concat(room.log || []);
    
    const oppSide = myTradeRoom.side === 'host' ? 'guest' : 'host';
    const opp = room[oppSide];
    
    if (opp && opp.card && opp.ready) {
      updateData.status = 'ready';
      updateData.log = ['✅ 양쪽 모두 카드를 선택했어요! 최종 교환을 눌러주세요!'].concat(updateData.log || []);
    }
    
    await roomRef.update(updateData);
    
    if (opp && opp.card && opp.ready) {
      alert('✅ 상대방도 카드를 선택했어요! "최종 교환" 버튼을 눌러주세요.');
    } else {
      alert('✅ 카드를 선택했어요! 상대방의 선택을 기다리는 중...');
    }
  } catch (e) {
    alert('❌ 요청 실패: ' + e.message);
  }
}

async function confirmTrade() {
  if (!myTradeRoom) {
    alert('교환방에 참가해주세요!');
    return;
  }
  
  if (!confirm('정말로 교환을 진행할까요? (되돌릴 수 없어요!)')) {
    return;
  }
  
  try {
    const roomRef = db.ref('trades/' + myTradeRoom.code);
    const snapshot = await roomRef.once('value');
    const room = snapshot.val();
    
    if (room.completed || room.status === 'completed') {
      alert('이미 교환이 완료되었어요!');
      return;
    }
    
    const mySide = myTradeRoom.side;
    const oppSide = mySide === 'host' ? 'guest' : 'host';
    const me = room[mySide];
    const opp = room[oppSide];
    
    if (!me || !opp || !me.card || !opp.card) {
      alert('양쪽 모두 카드를 선택해야 해요!');
      return;
    }
    
    const updateData = {};
    updateData[mySide + '/confirmed'] = true;
    
    if (opp.confirmed === true) {
      await executeSafeTrade2(roomRef, room);
    } else {
      updateData.status = 'confirm';
      updateData.log = ['⏳ ' + (mySide === 'host' ? '호스트' : '게스트') + '가 최종 확인했어요! 상대방도 확인해주세요.'].concat(room.log || []);
      await roomRef.update(updateData);
      
      document.getElementById('confirmTradeBtn').disabled = true;
      document.getElementById('confirmTradeBtn').textContent = '⏳ 확인 완료 (상대방 대기 중)';
      
      alert('✅ 최종 확인을 보냈어요! 상대방도 확인할 때까지 기다려주세요.');
    }
  } catch (e) {
    alert('❌ 교환 실패: ' + e.message);
  }
}

async function executeSafeTrade2(roomRef, room) {
  const mySide = myTradeRoom.side;
  const oppSide = mySide === 'host' ? 'guest' : 'host';
  const myCard = room[mySide].card;
  const oppCard = room[oppSide].card;
  
  const myRarity = state.owned[myCard]?.rarity || 'common';
  const oppRarity = state.owned[oppCard]?.rarity || 'common';
  
  try {
    if (room.completed || room.status === 'completed') {
      alert('이미 교환이 완료되었어요!');
      return;
    }
    
    console.log('📤 보낼 카드:', myCard, '등급:', myRarity);
    console.log('📥 받을 카드:', oppCard, '등급:', oppRarity);
    
    if (!state.owned[myCard]) {
      alert('보낼 카드가 없어요!');
      return;
    }
    
    state.owned[myCard].count -= 1;
    if (state.owned[myCard].count <= 0) {
      delete state.owned[myCard];
    }
    
    if (!state.owned[oppCard]) {
      state.owned[oppCard] = { count: 1, rarity: oppRarity };
    } else {
      state.owned[oppCard].count += 1;
    }
    
    saveState();
    
    await roomRef.update({
      status: 'completed',
      completed: true,
      log: ['✅ 교환 완료! ' + getPokemonByName(myCard)?.name + ' ↔ ' + getPokemonByName(oppCard)?.name].concat(room.log || []),
      exchangeResult: {
        myCard: myCard,
        oppCard: oppCard,
        myRarity: myRarity,
        oppRarity: oppRarity,
        timestamp: Date.now()
      }
    });
    
    renderDex();
    updateStatline();
    
    const pokemon = getPokemonByName(oppCard);
    alert(`✅ 교환 완료! ${pokemon ? pokemon.name : oppCard} 카드를 받았어요! (${getRarityInfo(oppRarity).label} 등급)`);
    
    leaveTradeRoom();
    renderTradeTab();
    
  } catch (e) {
    console.error('❌ 교환 오류:', e);
    alert('❌ 교환 중 오류가 발생했어요. 다시 시도해주세요.');
  }
}

function leaveTradeRoom() {
  if (tradeListener) {
    try { tradeListener.off(); } catch(e) {}
    tradeListener = null;
  }
  
  if (myTradeRoom) {
    if (myTradeRoom.side === 'host') {
      db.ref('trades/' + myTradeRoom.code).remove().catch(() => {});
    }
    myTradeRoom = null;
  }
  
  const statusEl = document.getElementById('tradeStatus');
  if (statusEl) {
    statusEl.style.display = 'none';
    statusEl.innerHTML = '';
  }
  
  const sendBtn = document.getElementById('sendTradeBtn');
  if (sendBtn) {
    sendBtn.disabled = true;
    sendBtn.style.display = 'block';
  }
  
  const confirmBtn = document.getElementById('confirmTradeBtn');
  if (confirmBtn) {
    confirmBtn.style.display = 'none';
  }
  
  const partnerEl = document.getElementById('tradePartnerInfo');
  if (partnerEl) {
    partnerEl.innerHTML = '아직 참가자가 없어요';
  }
  
  const displayEl = document.getElementById('tradeStatusDisplay');
  if (displayEl) {
    displayEl.innerHTML = '⏳ 교환방에 참가하면 상태가 표시돼요';
    displayEl.style.color = '#B7AFDE';
    displayEl.style.border = '1px solid transparent';
  }
}

// ===== 자정 초기화 =====
function resetDailyContent() {
  const key = todayKey();
  
  state.quizDoneToday = null;
  currentQuiz = { questions: [], currentIndex: 0, correctCount: 0, isFinished: false };
  
  if (!state.dailyMissions[key]) {
    state.dailyMissions[key] = {};
  }
  
  state.mathQuiz = { today: null, questions: [], currentIndex: 0, results: [], completed: false };
  
  if (state.raid && state.raid.today !== key) {
    state.raid = { boss: null, hp: 0, maxHp: 0, completed: false, today: null, rewardCollected: false, attackChance: 0 };
  }
  
  saveState();
  
  renderQuizMission();
  renderMathQuiz();
  renderLifeMissions();
  renderRaidMission();
  
  console.log('✅ 오늘의 콘텐츠가 초기화되었어요!');
}

// ===== 초기화 =====
async function initGame() {
  document.getElementById('loadingScreen').style.display = 'block';
  document.querySelectorAll('section').forEach(s => s.style.display = 'none');
  
  const hasSavedData = loadState();
  await loadAllPokemon();
  EVOLVABLE_POKEMON_LIST = await getAllEvolvablePokemon();
  
  if (!hasSavedData) {
    console.log('🆕 첫 실행 - 새 상태 생성');
    state.owned = {};
    state.wins = 0;
    state.missionsWon = 0;
    state.team = [];
    state.dailyMissions = {};
    state.customMissions = [];
    state.pet = null;
    state.quizStats = { total: 0, correct: 0 };
    state.quizDoneToday = null;
    state.playerAge = null;
    state.mathQuiz = { today: null, questions: [], currentIndex: 0, results: [], completed: false };
    state.mathStats = { total: 0, correct: 0 };
    state.raid = { boss: null, hp: 0, maxHp: 0, completed: false, today: null, rewardCollected: false, attackChance: 0 };
    saveState();
  }
  
  // 자정 초기화 타이머
  let lastCheckedDate = todayKey();
  setInterval(function() {
    const currentDate = todayKey();
    if (currentDate !== lastCheckedDate) {
      console.log('📅 새 날짜 감지! (' + lastCheckedDate + ' → ' + currentDate + ')');
      lastCheckedDate = currentDate;
      resetDailyContent();
    }
  }, 60000);
  
  document.getElementById('loadingStatus').textContent = 
    '✅ ' + POKEMON_LIST.length + '마리 | 진화: ' + EVOLVABLE_POKEMON_LIST.length + '종 | 보유: ' + Object.keys(state.owned).length + '마리';
  
  document.getElementById('loadingScreen').style.display = 'none';
  
  if (!state.playerAge) {
    document.getElementById('ageScreen').style.display = 'block';
    document.querySelectorAll('section').forEach(s => s.style.display = 'none');
  } else {
    document.querySelectorAll('section').forEach(s => s.style.display = '');
    document.getElementById('tab-mission').classList.add('active');
    renderAll();
  }
}

function renderAll() {
  updateStatline();
  renderFilters();
  renderDex();
  renderQuizMission();
  renderBattleSetup();
  renderPetTab();
  renderTradeTab();
  renderRaidMission();
  renderMathQuiz();
}

// ===== 실행 =====
initGame();
