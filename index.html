<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>포켓몬 카드 마스터 v7.5</title>

<!-- ===== Firebase SDK ===== -->
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">

<style>
  /* ===== 모든 스타일 (기존과 동일) ===== */
  :root {
    --ink: #232042;
    --ink-2: #312B57;
    --paper: #FFF8EC;
    --paper-2: #FCEBC9;
    --sun: #FFC93C;
    --sun-2: #FFE08A;
    --fire: #F0653B;
    --water: #3E9FDC;
    --grass: #5FB05A;
    --electric: #F2C230;
    --normal: #A6A0BE;
    --text-dark: #2A2440;
    --good: #4CAF7D;
    --bad: #E4614B;
    --font-display: 'Baloo 2', sans-serif;
    --font-body: 'Inter', sans-serif;
    --font-mono: 'JetBrains Mono', monospace;
    
    --common: #A6A0BE;
    --rare: #4CAF7D;
    --super-rare: #3E9FDC;
    --ultra-rare: #9B59B6;
    --special: #FF6B35;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: radial-gradient(circle at 15% 0%, #3A3468 0%, var(--ink) 60%), var(--ink);
    color: var(--paper);
    font-family: var(--font-body);
    min-height: 100vh;
    -webkit-tap-highlight-color: transparent;
    font-size: 16px;
  }
  .app { max-width: 720px; margin: 0 auto; padding: 0 0 86px; min-height: 100vh; }
  
  header.top { padding: 22px 20px 14px; text-align: center; position: relative; }
  .eyebrow { 
    font-family: var(--font-mono); 
    font-size: 14px; 
    letter-spacing: .22em; 
    color: var(--sun); 
    text-transform: uppercase; 
    margin-bottom: 4px;
    cursor: pointer;
    user-select: none;
  }
  .eyebrow:hover { opacity: 0.7; }
  h1 { font-family: var(--font-display); font-weight: 800; font-size: 28px; margin: 0; color: var(--paper); }
  .sub { font-size: 14px; color: #B7AFDE; margin-top: 4px; }
  
  .statline {
    display: flex;
    justify-content: center;
    gap: 6px;
    padding: 6px 8px 2px;
    font-family: var(--font-mono);
    font-size: 10px;
    flex-wrap: wrap;
  }
  .statline .pill {
    display: flex;
    align-items: center;
    gap: 3px;
    color: var(--sun-2);
    background: rgba(255,255,255,.05);
    padding: 3px 8px;
    border-radius: 8px;
  }
  .statline .pill b { color: var(--paper); font-weight: 700; }
  
  main { padding: 10px 10px 4px; }
  section { display: none; animation: fadein .25s ease; }
  section.active { display: block; }
  @keyframes fadein { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  
  h2.section-title { font-family: var(--font-display); font-size: 18px; font-weight: 700; margin: 2px 0 10px; color: var(--paper); }
  
  .panel {
    background: linear-gradient(160deg, var(--ink-2), #2A2650);
    border: 1px solid rgba(255,201,60,.2);
    border-radius: 14px;
    padding: 14px 12px;
    position: relative;
    overflow: hidden;
  }
  
  .btn {
    font-family: var(--font-display);
    font-weight: 700;
    font-size: 15px;
    padding: 10px 16px;
    border-radius: 10px;
    border: none;
    cursor: pointer;
    background: var(--sun);
    color: #2A2440;
    box-shadow: 0 3px 0 #C99414;
    transition: transform .1s, box-shadow .1s;
  }
  .btn:active { transform: translateY(2px); box-shadow: 0 1px 0 #C99414; }
  .btn:disabled { opacity: .35; cursor: not-allowed; box-shadow: none; }
  .btn.ghost { background: transparent; border: 2px solid rgba(255,201,60,.4); color: var(--sun-2); box-shadow: none; }
  .btn.small { font-size: 12px; padding: 6px 10px; border-radius: 8px; box-shadow: 0 2px 0 #C99414; }
  .btn.block { width: 100%; }
  .btn.good { background: var(--good); box-shadow: 0 3px 0 #2E7A54; color: #fff; }
  
  /* ===== 나이 입력 ===== */
  .age-input-wrap {
    text-align: center;
    padding: 30px 20px;
  }
  .age-input-wrap .big-emoji { font-size: 60px; }
  .age-input-wrap .title { font-family: var(--font-display); font-size: 22px; margin: 12px 0; }
  .age-input-wrap .sub { font-size: 14px; color: #B7AFDE; }
  .age-input-wrap input {
    width: 100px;
    padding: 12px;
    font-size: 28px;
    text-align: center;
    border-radius: 12px;
    border: 2px solid rgba(255,201,60,.3);
    background: rgba(255,255,255,.05);
    color: var(--paper);
    font-family: var(--font-display);
    margin: 16px auto;
    display: block;
  }
  .age-input-wrap .age-buttons {
    display: flex;
    gap: 8px;
    justify-content: center;
    flex-wrap: wrap;
    margin-top: 12px;
  }
  .age-input-wrap .age-buttons .btn {
    font-size: 14px;
    padding: 10px 18px;
  }
  
  /* ===== 수학 퀴즈 ===== */
  .math-quiz {
    text-align: center;
    padding: 10px 0;
  }
  .math-quiz .question {
    font-family: var(--font-display);
    font-size: 24px;
    color: var(--paper);
    margin: 12px 0;
  }
  .math-quiz .pokemon-hint {
    font-size: 14px;
    color: #B7AFDE;
    margin: 6px 0;
  }
  .math-quiz .options {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr 1fr;
    gap: 8px;
    margin: 12px 0;
  }
  .math-quiz .options .opt-btn {
    font-family: var(--font-display);
    font-size: 20px;
    padding: 14px 8px;
    border-radius: 10px;
    border: 2px solid rgba(255,201,60,.2);
    background: rgba(255,255,255,.05);
    color: var(--paper);
    cursor: pointer;
    transition: all .2s;
  }
  .math-quiz .options .opt-btn:active { transform: scale(.95); }
  .math-quiz .options .opt-btn.correct { background: var(--good); border-color: var(--good); }
  .math-quiz .options .opt-btn.wrong { background: var(--bad); border-color: var(--bad); }
  .math-quiz .options .opt-btn:disabled { opacity: .5; cursor: not-allowed; }
  .math-quiz .feedback { font-family: var(--font-mono); font-size: 14px; margin-top: 10px; min-height: 24px; }
  .math-quiz .feedback.ok { color: var(--sun-2); }
  .math-quiz .feedback.no { color: #F0A79A; }
  
  .mission-intro { text-align: center; }
  .mission-intro .big-emoji { font-size: 42px; margin-bottom: 4px; }
  
  .quiz-box { text-align: center; }
  .quiz-q { font-family: var(--font-display); font-size: 16px; margin-bottom: 10px; color: var(--paper); }
  .quiz-art-wrap {
    width: 100px; height: 100px; margin: 0 auto 10px; border-radius: 16px;
    background: radial-gradient(circle at 40% 30%, rgba(255,255,255,.08), transparent 70%);
    display: flex; align-items: center; justify-content: center;
    border: 2px dashed rgba(255,201,60,.3);
  }
  .quiz-art-wrap img { width: 68%; height: 68%; object-fit: contain; transition: filter .3s ease; }
  .quiz-art-wrap.silhouette img { filter: brightness(0) saturate(0); opacity: .92; }
  .choice-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 6px;
  }
  .choice-btn {
    font-family: var(--font-body);
    font-weight: 600;
    font-size: 13px;
    padding: 10px 8px;
    border-radius: 8px;
    border: 2px solid rgba(255,255,255,.12);
    background: rgba(255,255,255,.04);
    color: var(--paper);
    cursor: pointer;
  }
  .choice-btn:active { transform: scale(.97); }
  .choice-btn.correct { background: var(--good); border-color: var(--good); color: #fff; }
  .choice-btn.wrong { background: var(--bad); border-color: var(--bad); color: #fff; }
  .choice-btn.dim { opacity: .4; }
  .quiz-feedback { margin-top: 10px; font-family: var(--font-mono); font-size: 12px; min-height: 18px; }
  .quiz-feedback.ok { color: var(--sun-2); }
  .quiz-feedback.no { color: #F0A79A; }
  
  .card {
    border-radius: 12px;
    position: relative;
    overflow: hidden;
    background: linear-gradient(160deg, var(--paper) 0%, var(--paper-2) 100%);
    color: var(--text-dark);
    border: 2px solid var(--sun);
    padding: 6px;
    box-shadow: 0 4px 10px rgba(0,0,0,.3);
    cursor: pointer;
    transition: transform .2s;
  }
  .card:active { transform: scale(.96); }
  .card .art { width: 100%; aspect-ratio: 1/0.85; border-radius: 8px; display: flex; align-items: center; justify-content: center;
    background: radial-gradient(circle at 50% 35%, rgba(255,255,255,.5), transparent 70%); }
  .card .art img { width: 60%; height: 60%; object-fit: contain; }
  .card .name { font-family: var(--font-display); font-weight: 700; font-size: 11px; text-align: center; margin-top: 2px; line-height: 1.2; }
  .card .type-tag {
    display: block; margin: 2px auto 3px; width: fit-content; font-family: var(--font-mono); font-size: 7px;
    padding: 1px 6px; border-radius: 14px; color: #fff; letter-spacing: .04em;
  }
  .card .statrow { display: flex; justify-content: space-between; font-family: var(--font-mono); font-size: 6px; padding: 0 2px; color: #5A5170; }
  .card .statrow span b { display: block; font-size: 8px; color: var(--text-dark); }
  .card.locked { filter: grayscale(1) brightness(.5); }
  .card.locked .name { font-size: 10px; color: #888; }
  .card.pop-in { animation: popin .4s cubic-bezier(.34,1.56,.64,1); }
  @keyframes popin { from { opacity: 0; transform: scale(.5) rotate(-4deg); } to { opacity: 1; transform: none; } }
  
  .card.rarity-common { border-color: var(--common); }
  .card.rarity-rare { border-color: var(--rare); box-shadow: 0 0 10px rgba(76,175,125,.2); }
  .card.rarity-super-rare { border-color: var(--super-rare); box-shadow: 0 0 14px rgba(62,159,220,.3); }
  .card.rarity-ultra-rare { border-color: var(--ultra-rare); box-shadow: 0 0 18px rgba(155,89,182,.4); }
  .card.rarity-special { border-color: var(--special); box-shadow: 0 0 20px rgba(255,107,53,.5); animation: glow-special 1.5s infinite alternate; }
  @keyframes glow-special {
    from { box-shadow: 0 0 12px rgba(255,107,53,.3); }
    to { box-shadow: 0 0 25px rgba(255,107,53,.5), 0 0 40px rgba(255,107,53,.2); }
  }
  
  .card .rarity-badge {
    position: absolute;
    top: 3px;
    right: 3px;
    font-family: var(--font-mono);
    font-size: 8px;
    font-weight: 700;
    padding: 1px 5px;
    border-radius: 6px;
    color: #fff;
    letter-spacing: .04em;
    text-shadow: 0 1px 2px rgba(0,0,0,.3);
    background: rgba(0,0,0,.3);
    backdrop-filter: blur(2px);
    line-height: 1.2;
  }
  
  .grid { 
    display: grid; 
    grid-template-columns: repeat(3,1fr);
    gap: 5px;
  }
  .card.mini { 
    width: 100%;
    padding: 5px;
  }
  .card.mini .art { aspect-ratio: 1/0.8; }
  .card.mini .art img { width: 50%; height: 50%; }
  .card.mini .name { font-size: 9px; margin-top: 1px; }
  .card.mini .statrow { font-size: 6px; padding: 0 1px; }
  .card.mini .statrow span b { font-size: 7px; }
  .card.mini .type-tag { font-size: 6px; padding: 1px 5px; margin: 2px auto 2px; }
  .card.mini .rarity-badge { font-size: 7px; padding: 1px 4px; top: 2px; right: 2px; }
  
  .rarity-bonus {
    font-size: 8px;
    font-family: var(--font-mono);
    color: #B7AFDE;
    text-align: center;
    padding: 2px 0;
    border-top: 1px solid rgba(255,255,255,.05);
    margin-top: 2px;
  }
  .rarity-bonus span { color: var(--sun-2); font-weight: 700; }
  
  .filter-row { display: flex; gap: 4px; margin-bottom: 8px; flex-wrap: wrap; }
  .chip {
    font-family: var(--font-mono);
    font-size: 8px;
    padding: 3px 7px;
    border-radius: 14px;
    border: 1px solid rgba(255,201,60,.25);
    color: #B7AFDE;
    cursor: pointer;
    background: transparent;
    transition: all .2s;
    white-space: nowrap;
  }
  .chip.active { background: var(--sun); color: #2A2440; border-color: var(--sun); font-weight: 700; }
  
  .modal-overlay {
    display: none;
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0,0,0,.8);
    backdrop-filter: blur(6px);
    z-index: 1000;
    align-items: center;
    justify-content: center;
    padding: 16px;
    animation: fadein .25s;
  }
  .modal-overlay.open { display: flex; }
  .modal-content {
    max-width: 360px;
    width: 100%;
    max-height: 90vh;
    overflow-y: auto;
    background: linear-gradient(160deg, var(--ink-2), #1A1840);
    border: 2px solid var(--sun);
    border-radius: 18px;
    padding: 16px 14px 20px;
    color: var(--paper);
    position: relative;
    animation: popin .35s cubic-bezier(.34,1.56,.64,1);
  }
  .modal-close {
    position: absolute;
    top: 8px;
    right: 12px;
    font-size: 20px;
    background: none;
    border: none;
    color: #B7AFDE;
    cursor: pointer;
    font-family: var(--font-body);
  }
  .modal-close:hover { color: var(--paper); }
  .modal-art { text-align: center; padding: 4px 0; }
  .modal-art img { width: 120px; height: 120px; object-fit: contain; }
  .modal-name { font-family: var(--font-display); font-size: 20px; text-align: center; margin: 2px 0; }
  .modal-types { text-align: center; margin: 4px 0 8px; }
  .modal-types span {
    display: inline-block;
    padding: 2px 10px;
    border-radius: 14px;
    font-family: var(--font-mono);
    font-size: 10px;
    color: #fff;
    margin: 0 3px;
  }
  .modal-stats {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 5px;
    margin: 8px 0;
    text-align: center;
    background: rgba(255,255,255,.05);
    border-radius: 8px;
    padding: 8px;
  }
  .modal-stats div { font-family: var(--font-mono); font-size: 9px; color: #B7AFDE; }
  .modal-stats div b { display: block; font-size: 14px; color: var(--paper); margin-top: 2px; }
  
  .modal-section {
    margin: 8px 0 5px;
    padding: 8px 10px;
    background: rgba(255,255,255,.04);
    border-radius: 8px;
    border-left: 3px solid var(--sun);
  }
  .modal-section h4 {
    font-family: var(--font-display);
    font-size: 12px;
    margin: 0 0 3px;
    color: var(--sun-2);
  }
  .modal-section p {
    font-size: 11px;
    line-height: 1.5;
    margin: 2px 0;
    color: #D8D2EF;
  }
  
  .team-slots { display: flex; gap: 6px; margin-bottom: 10px; }
  .slot { flex: 1; aspect-ratio: 1/1.05; border-radius: 10px; border: 2px dashed rgba(255,201,60,.3);
    display: flex; align-items: center; justify-content: center; cursor: pointer; background: rgba(255,255,255,.02); position: relative; }
  .slot.filled { border-style: solid; border-color: var(--sun); }
  .slot .mini-art { width: 60%; } .slot .mini-art img { width: 100%; object-fit: contain; }
  .slot .x { position: absolute; top: 2px; right: 4px; font-size: 9px; color: #B7AFDE; }
  
  .picker { display: none; margin-bottom: 10px; }
  .picker.open { display: block; }
  .pick-grid { display: grid; grid-template-columns: repeat(3,1fr); gap: 5px; max-height: 200px; overflow-y: auto; padding: 4px; }
  .pick-item { border-radius: 8px; border: 1.5px solid rgba(255,201,60,.2); padding: 4px; text-align: center; cursor: pointer; background: rgba(255,255,255,.03); }
  .pick-item img { width: 36px; height: 36px; object-fit: contain; }
  .pick-item .n { font-size: 8px; font-family: var(--font-mono); margin-top: 2px; color: #B7AFDE; }
  .pick-item.disabled { opacity: .3; pointer-events: none; }
  
  .arena { background: linear-gradient(180deg, rgba(255,255,255,.03), transparent); border: 1px solid rgba(255,201,60,.15); border-radius: 12px; padding: 12px; margin-top: 4px; }
  .vs-row { display: flex; align-items: center; justify-content: space-between; gap: 6px; }
  .fighter { flex: 1; text-align: center; }
  .fighter .art-wrap { width: 56px; height: 56px; margin: 0 auto 4px; border-radius: 50%; background: radial-gradient(circle at 40% 30%, rgba(255,255,255,.1), transparent 70%); display: flex; align-items: center; justify-content: center; }
  .fighter .art-wrap img { width: 58%; object-fit: contain; }
  .fighter .fname { font-family: var(--font-display); font-weight: 700; font-size: 11px; }
  .fighter .hpbar { height: 5px; border-radius: 4px; background: rgba(255,255,255,.1); margin-top: 3px; overflow: hidden; }
  .fighter .hpbar > div { height: 100%; background: #7CC08A; transition: width .35s ease; }
  .fighter .hpbar.low > div { background: #D9704F; }
  .fighter .hptext { font-family: var(--font-mono); font-size: 8px; color: #B7AFDE; margin-top: 2px; }
  .vs-seal { font-family: var(--font-display); font-weight: 800; font-size: 14px; color: var(--sun); width: 32px; height: 32px; border: 2px solid var(--sun); border-radius: 50%; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .turn-banner { text-align: center; font-family: var(--font-mono); font-size: 10px; color: var(--sun-2); margin-top: 6px; }
  .log { margin-top: 6px; background: rgba(0,0,0,.25); border-radius: 8px; padding: 6px 8px; height: 70px; overflow-y: auto; font-family: var(--font-mono); font-size: 9px; color: #D8D2EF; display: flex; flex-direction: column-reverse; }
  .log p { margin: 2px 0; line-height: 1.4; }
  .log p.eff { color: #7CC08A; } .log p.bad { color: #E4917F; } .log p.sys { color: var(--sun-2); }
  .battle-actions { display: flex; gap: 6px; margin-top: 8px; }
  .battle-actions .btn { flex: 1; font-size: 13px; padding: 8px 10px; }
  .empty-note { text-align: center; color: #8d84b0; font-family: var(--font-mono); font-size: 10px; padding: 20px 8px; border: 1px dashed rgba(255,201,60,.2); border-radius: 10px; }
  
  nav.tabbar {
    position: fixed; bottom: 0; left: 0; right: 0;
    background: rgba(35,32,66,.95);
    backdrop-filter: blur(10px);
    border-top: 1px solid rgba(255,201,60,.15);
    display: flex;
    max-width: 720px;
    margin: 0 auto;
  }
  nav.tabbar button {
    flex: 1; background: none; border: none; color: #8d84b0; padding: 6px 2px 8px;
    font-family: var(--font-body); font-size: 9px; cursor: pointer;
    display: flex; flex-direction: column; align-items: center; gap: 2px;
  }
  nav.tabbar button .ic { font-size: 16px; }
  nav.tabbar button.active { color: var(--sun); }
  
  .life-row { display: flex; align-items: center; gap: 8px; padding: 8px 6px; border-radius: 8px; background: rgba(255,255,255,.03); margin-bottom: 5px; }
  .life-row .em { font-size: 16px; }
  .life-row .lbl { flex: 1; font-family: var(--font-body); font-weight: 600; font-size: 12px; }
  .life-row .done-tag { font-family: var(--font-mono); font-size: 9px; color: var(--good); }
  .life-row .btn.small { font-size: 9px; padding: 3px 8px; }
  
  .starter-grid { display: grid; grid-template-columns: repeat(3,1fr); gap: 6px; }
  .starter-card { background: rgba(255,255,255,.03); border: 2px solid rgba(255,201,60,.2); border-radius: 10px; padding: 8px 4px; text-align: center; cursor: pointer; }
  .starter-card:active { transform: scale(.97); }
  .starter-card img { width: 44px; height: 44px; object-fit: contain; }
  .starter-card .n { font-family: var(--font-display); font-weight: 700; font-size: 11px; margin-top: 2px; }
  
  .pet-hero { text-align: center; padding: 4px 0; }
  .pet-hero .art-big { width: 100px; height: 100px; margin: 0 auto 4px; border-radius: 50%; background: radial-gradient(circle at 40% 30%, rgba(255,255,255,.1), transparent 70%); display: flex; align-items: center; justify-content: center; }
  .pet-hero .art-big img { width: 64%; object-fit: contain; }
  .pet-hero .pname { font-family: var(--font-display); font-weight: 800; font-size: 16px; }
  .pet-hero .plevel { font-family: var(--font-mono); font-size: 10px; color: var(--sun-2); margin-top: 2px; }
  .pet-mood { font-family: var(--font-mono); font-size: 10px; color: #B7AFDE; text-align: center; margin: 4px 0 10px; }
  
  .stat-row { margin-bottom: 8px; }
  .stat-row .stat-label { display: flex; justify-content: space-between; font-family: var(--font-mono); font-size: 9px; color: #B7AFDE; margin-bottom: 2px; }
  .stat-row .progress-bar { height: 5px; }
  .stat-row.hunger .progress-bar > div { background: linear-gradient(90deg,#F0653B,#F0A87A); }

  normal: { strong: [], weak: ['rock','ghost'], immune: ['ghost'] },

};

function getEffMult(attackType, defendType) {
  const chart = TYPE_CHART[attackType];
  if (!chart) return 1;
  if (chart.immune && chart.immune.includes(defendType)) return 0;
  if (chart.strong && chart.strong.includes(defendType)) return 2;
  if (chart.weak && chart.weak.includes(defendType)) return 0.5;
  return 1;
}

function rollRarity() {
  const total = RARITIES.reduce((sum, r) => sum + r.weight, 0);
  let rand = Math.random() * total;
  for (const r of RARITIES) {
    rand -= r.weight;
    if (rand <= 0) return r.id;
  }
  return 'common';
}

function getRarityInfo(id) {
  return RARITIES.find(r => r.id === id) || RARITIES[0];
}

function getRarityBonus(id) {
  const info = getRarityInfo(id);
  return info.bonus || { hp: 0, atk: 0, def: 0, spd: 0 };
}

function getRarityDamageBonus(rarity) {
  const bonuses = {
    'common': 0,
    'rare': 2,
    'super-rare': 5,
    'ultra-rare': 8,
    'special': 12
  };
  return bonuses[rarity] || 0;
}

}

const CACHE_KEY = 'pokedex-all-v7';
const CACHE_TIME_KEY = 'pokedex-time-v7';
const CACHE_DURATION = 7 * 24 * 60 * 60 * 1000;

async function loadAllPokemon() {
  try {
    const cached = localStorage.getItem(CACHE_KEY);
    const cachedTime = localStorage.getItem(CACHE_TIME_KEY);
    
    if (cached && cachedTime && (Date.now() - parseInt(cachedTime)) < CACHE_DURATION) {
      POKEMON_LIST = JSON.parse(cached);
      console.log('✅ 캐시에서 로드!', POKEMON_LIST.length + '마리');
      document.getElementById('loadingStatus').textContent = '캐시에서 ' + POKEMON_LIST.length + '마리 로드! ⚡';
      return POKEMON_LIST;
    }
  } catch(e) {
    console.log('캐시 확인 실패:', e);
  }
  
  try {
    const listRes = await fetch('https://pokeapi.co/api/v2/pokemon?limit=10000');
    const listData = await listRes.json();
    const allUrls = listData.results.map(p => p.url);
    const batchSize = 50;
    let allPokemon = [];
    
    for (let i = 0; i < allUrls.length; i += batchSize) {
      const batch = allUrls.slice(i, i + batchSize);
      const promises = batch.map(async (url) => {
        try {
          const detailRes = await fetch(url);
          const detail = await detailRes.json();
          let koreanName = detail.name;
          try {
            const speciesRes = await fetch(detail.species.url);
            const speciesData = await speciesRes.json();
            const name = speciesData.names.find(n => n.language.name === 'ko');
            if (name) koreanName = name.name;
          } catch (e) {}
          return {
            id: detail.id,
            name: koreanName,
            engName: detail.name,
            type: detail.types[0].type.name,
            types: detail.types.map(t => t.type.name),
            hp: detail.stats[0].base_stat,
            atk: detail.stats[1].base_stat,
            def: detail.stats[2].base_stat,
            spd: detail.stats[5].base_stat,
            image: detail.sprites.other['official-artwork']?.front_default || detail.sprites.front_default,
            speciesUrl: detail.species.url,
            cryUrl: detail.cries?.latest || detail.cries?.legacy || null
          };
        } catch (e) {
          return null;
        }
      });
      const results = await Promise.all(promises);
      allPokemon = allPokemon.concat(results.filter(p => p !== null));
      const total = allUrls.length;
      const done = allPokemon.length;
      document.getElementById('loadingStatus').textContent = 'PokeAPI 로딩 중... ' + done + '/' + total;
    }
    allPokemon.sort((a, b) => a.id - b.id);
    POKEMON_LIST = allPokemon;
    console.log('✅ API에서 로드!', POKEMON_LIST.length + '마리');
    try {
      localStorage.setItem(CACHE_KEY, JSON.stringify(POKEMON_LIST));
      localStorage.setItem(CACHE_TIME_KEY, String(Date.now()));
      console.log('💾 캐시 저장 완료!');
    } catch(e) {}
    return POKEMON_LIST;
  } catch (error) {
    console.error('❌ API 로드 실패:', error);
    POKEMON_LIST = getFallbackData();
    return POKEMON_LIST;
  }
}

async function getAllEvolvablePokemon() {
  try {
    const listRes = await fetch('https://pokeapi.co/api/v2/evolution-chain?limit=1000');
    const listData = await listRes.json();
    const allEvolvable = [];
    for (const chainRef of listData.results) {
      const chainRes = await fetch(chainRef.url);
      const chainData = await chainRes.json();
      function extractAllNames(chainLink) {
        const names = [];
        names.push(chainLink.species.name);
        if (chainLink.evolves_to && chainLink.evolves_to.length > 0) {
          for (const nextLink of chainLink.evolves_to) {
            names.push(...extractAllNames(nextLink));
          }
        }
        return names;
      }
      allEvolvable.push(...extractAllNames(chainData.chain));
    }
    const unique = [...new Set(allEvolvable)].sort();
    console.log('✅ 진화 가능 포켓몬', unique.length + '종');
    return unique;
  } catch (error) {
    console.error('❌ 진화 가능 포켓몬 로드 실패:', error);
    return ['bulbasaur', 'charmander', 'squirtle', 'pikachu', 'eevee', 'magikarp'];
  }
}

function generateOptions(answer, age) {
  let options = [answer];
  while (options.length < 4) {
    let offset = Math.floor(Math.random() * 5) + 1;
    if (Math.random() < 0.5) offset = -offset;
    const wrong = answer + offset;
    if (wrong >= 0 && !options.includes(wrong) && wrong !== answer) {
      options.push(wrong);
    }
  }
  return options.sort(() => Math.random() - 0.5);
}

function pokemonImage(pokemon, size = '100%') {
  if (!pokemon || !pokemon.image) {
    return `<div style="width:${size};height:${size};background:rgba(255,255,255,.1);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:20px;">❓</div>`;
  }
  return `<img src="${pokemon.image}" alt="${pokemon.name}" style="width:${size};height:${size};object-fit:contain;display:block;">`;
}

function formatTime(ms) {
  if (ms <= 0) return '⏳ 준비 완료!';
  const hours = Math.floor(ms / 3600000);
  const minutes = Math.floor((ms % 3600000) / 60000);
  const seconds = Math.floor((ms % 60000) / 1000);
  if (hours > 0) return hours + '시간 ' + minutes + '분';
  if (minutes > 0) return minutes + '분 ' + seconds + '초';
  return seconds + '초';
}

// ===== TTS =====
function speakText(text, lang = 'ko-KR') {
  if (!window.speechSynthesis) return;
  window.speechSynthesis.cancel();
  const utterance = new SpeechSynthesisUtterance(text);
  utterance.lang = lang;
  utterance.rate = 0.85;
  utterance.pitch = 1.0;
  utterance.volume = 1.0;
  const voices = window.speechSynthesis.getVoices();
  const koreanVoice = voices.find(v => v.lang.startsWith('ko'));
  if (koreanVoice) utterance.voice = koreanVoice;
  window.speechSynthesis.speak(utterance);
}

function speakPokemonInfo(pokemon) {
  if (!pokemon) return;
  const typeLabel = getTypeLabel(pokemon.type);
  let text = `${pokemon.name} ${typeLabel}타입 포켓몬! `;
  if (pokemon._moves && pokemon._moves.length > 0) {
    text += `배우는 기술은 ${pokemon._moves.slice(0, 3).join(', ')}! `;
  }
  if (pokemon._description) text += `${pokemon._description} `;
  if (pokemon._evoChain && pokemon._evoChain.length > 0) {
    text += `진화 과정은 ${pokemon._evoChain.map(e => e.name).join(' → ')}!`;
  }
  speakText(text);
}

// ===== 저장/로드 =====
function loadState() {
  try {
    const saved = localStorage.getItem('pkmn-state-v7');
    if (saved) {
      const parsed = JSON.parse(saved);
      state = Object.assign(state, parsed);
      console.log('✅ 저장된 상태 로드 완료!', Object.keys(state.owned).length + '마리 보유');
      return true;
    }
  } catch(e) {
    console.log('저장된 데이터 없음:', e);
  }
  return false;
}

function saveState() {
  try {
    localStorage.setItem('pkmn-state-v7', JSON.stringify(state));
    console.log('💾 상태 저장 완료!');
  } catch(e) {
    console.error('저장 실패:', e);
  }
}

function updateStatline() {
  const total = POKEMON_LIST.length;
  const owned = Object.keys(state.owned).length;
  document.getElementById('collectedCount').textContent = owned;
  document.getElementById('totalCount').textContent = total;
  document.getElementById('missionCount').textContent = state.missionsWon;
  document.getElementById('winCount').textContent = state.wins;
  document.getElementById('quizCount').textContent = state.quizStats.total || 0;
  document.getElementById('mathCount').textContent = state.mathStats.total || 0;
  document.getElementById('raidCount').textContent = state.raid?.completed ? 1 : 0;
  
  let specialCount = 0;
  for (const key in state.owned) {
    if (state.owned[key].rarity === 'special') specialCount += state.owned[key].count || 1;
  }
  document.getElementById('specialCount').textContent = specialCount;
}

  }
  state.playerAge = age;

  document.getElementById('tab-mission').classList.add('active');

// ===== 카드 획득 =====
function grantCardReward() {
  const locked = POKEMON_LIST.filter(c => !state.owned[c.engName]);
  const pool = locked.length > 0 ? locked : POKEMON_LIST;
  const target = pool[Math.floor(Math.random() * pool.length)];
  const rarity = rollRarity();
  const isNew = !state.owned[target.engName];
  
  if (!state.owned[target.engName]) {
    state.owned[target.engName] = { count: 1, rarity: rarity };
  } else {
    state.owned[target.engName].count += 1;
  }
  
  state.missionsWon = (state.missionsWon || 0) + 1;
  
  const title = isNew ? '🎉 새 포켓몬 획득!' : '🔄 중복 획득!';
  const subtitle = isNew ? '도감에 등록되었어요!' : `${getRarityInfo(rarity).label} 등급!`;
  showRewardPopup(target, title, subtitle);
  
  updateStatline();
  saveState();
  renderDex();
  return { target, rarity, isNew };
}

        <div style="font-family:var(--font-display);font-size:17px;">오늘의 퀴즈를 이미 풀었어요!</div>
        <div style="color:#B7AFDE;font-size:12px;margin-top:4px;">내일 다시 도전해주세요 😊</div>
      </div>

    const gotCard = Math.random() * 100 < rewardChance;
    state.quizDoneToday = key;
    saveState();

      <div class="mission-intro">
        <div class="big-emoji">📊</div>
        <div style="font-family:var(--font-display);font-size:18px;">퀴즈 완료!</div>
        <div style="font-size:13px;color:#B7AFDE;margin:6px 0;">
          ${currentQuiz.totalQuestions}문제 중 ${currentQuiz.correctCount}문제 정답!
        </div>

          <div style="background:rgba(255,201,60,.15);border-radius:10px;padding:10px;margin:10px 0;border:1px solid var(--sun);">

        ` : `

        `}
        <button class="btn small" id="resetQuizBtn">새 퀴즈 (내일)</button>
      </div>
    `;
    
    if (gotCard) {
      const result = grantCardReward();
      if (result) {
        const rInfo = getRarityInfo(result.rarity);
        setTimeout(() => {
          const rewardDiv = panel.querySelector('.mission-intro');
          if (rewardDiv) {
            rewardDiv.innerHTML += `
              <div class="reveal-wrap" style="margin-top:10px;">
                <div class="card pop-in rarity-${result.rarity}" style="width:140px;">
                  <div class="art">${pokemonImage(result.target)}</div>
                  <div class="name">${result.target.name}</div>

                  <span class="rarity-badge" style="background:${rInfo.color}">${rInfo.emoji} ${rInfo.label}</span>
                </div>
              </div>
            `;

      currentQuiz = { questions: [], currentIndex: 0, correctCount: 0, isFinished: false };

function generateQuizQuestions() {
  const total = 20;
  const questions = [];
  const shuffled = [...POKEMON_LIST].sort(() => Math.random() - 0.5);
  
  for (let i = 0; i < Math.min(total, shuffled.length); i++) {
    const pokemon = shuffled[i];
    const type = Math.random() < 0.5 ? 'silhouette' : 'type';
    let question, options, correctAnswer;
    
    if (type === 'silhouette') {
      question = '🕵️ 이 포켓몬은 누구일까요?';
      const distractors = getDistractors(pokemon, 3);
      const allOptions = [pokemon.name, ...distractors.map(d => d.name)].sort(() => Math.random() - 0.5);
      options = allOptions;
      correctAnswer = pokemon.name;
    } else {
      question = pokemon.name + '의 타입은?';
      const allTypes = Object.keys(TYPE_CHART);
      const wrongTypes = allTypes.filter(t => t !== pokemon.type).sort(() => Math.random() - 0.5).slice(0, 3);
      const allOptions = [getTypeLabel(pokemon.type), ...wrongTypes.map(t => getTypeLabel(t))].sort(() => Math.random() - 0.5);
      options = allOptions;
      correctAnswer = getTypeLabel(pokemon.type);
    }
    
    questions.push({
      pokemon,
      type,
      question,
      options,
      correctAnswer
    });
  }
  
  currentQuiz.questions = questions;
  currentQuiz.currentIndex = 0;
  currentQuiz.correctCount = 0;
  currentQuiz.totalQuestions = questions.length;
  currentQuiz.isFinished = false;
}

function getDistractors(exclude, n) {
  const pool = POKEMON_LIST.filter(c => c.engName !== exclude.engName);
  const picked = [];
  while (picked.length < n && pool.length) {
    const idx = Math.floor(Math.random() * pool.length);
    picked.push(pool.splice(idx, 1)[0]);
  }
  return picked;
}

function handleQuizAnswer(isCorrect) {
  document.querySelectorAll('.choice-btn').forEach(b => {
    b.classList.add('dim');
    b.disabled = true;
    if (b.dataset.answer === currentQuiz.questions[currentQuiz.currentIndex].correctAnswer) {
      b.classList.add('correct');
    } else if (!isCorrect && b.classList.contains('dim') && !b.classList.contains('correct')) {
      b.classList.add('wrong');
    }
  });
  
  const fb = document.getElementById('quizFeedback');
  state.quizStats.total = (state.quizStats.total || 0) + 1;
  
  if (isCorrect) {
    state.quizStats.correct = (state.quizStats.correct || 0) + 1;
    currentQuiz.correctCount++;
    fb.textContent = '✅ 정답!';
    fb.className = 'quiz-feedback ok';
    
    const rewardChance = 10;
    const gotCard = Math.random() * 100 < rewardChance;
    if (gotCard) {
      const reward = grantCardReward();
      if (reward) {
        setTimeout(() => {
          alert(`🎉 축하합니다! ${reward.target.name} 카드를 획득했어요! (${getRarityInfo(reward.rarity).label})`);
        }, 300);
      }
    }
    
    if (state.pet) {
      const threshold = petExpThreshold();
      const expBonus = Math.max(1, Math.round(threshold * 0.1));
      state.pet.exp += expBonus;
      console.log('✨ 퀴즈 정답! 포켓몬 경험치 +' + expBonus);
      
      const result = checkPetLevelUp();
      if (result.evolved) {
        state.pet.justEvolved = true;
        saveState();
        renderPetTab();
      }
      saveState();
      renderPetTab();
    }
    
  } else {
    fb.textContent = '❌ 정답은 "' + currentQuiz.questions[currentQuiz.currentIndex].correctAnswer + '"';
    fb.className = 'quiz-feedback no';
  }
  
  document.getElementById('quizArt')?.classList.remove('silhouette');
  updateStatline();
  
  setTimeout(() => {
    currentQuiz.currentIndex++;
    renderQuizMission();
  }, 1500);
}

  return generateSingleMathQuestion(age);
}

// ===== 🔥 수정된 generateMathQuestions =====
function generateMathQuestions() {
  const age = state.playerAge || 8;
  const key = todayKey();
  const questions = [];
  
  for (let i = 0; i < 10; i++) {
    let q;
    if (age <= 8) {
      // 🔥 8세 이하: 시각적 문제 (포켓몬 그림)
      q = generateVisualMathQuestion(age);
    } else {
      // 9세 이상: 일반 문제
      q = generateSingleMathQuestion(age);
    }
    questions.push(q);
  }
  
  state.mathQuiz = {
    today: key,
    questions: questions,
    currentIndex: 0,
    results: [],
    completed: false
  };
  saveState();
}

// ===== 🔥 개별 문제 생성 =====
function generateSingleMathQuestion(age) {
  let num1, num2, operation, answer, question, options;
  
  if (age <= 7) {
    num1 = Math.floor(Math.random() * 9) + 1;
    num2 = Math.floor(Math.random() * 9) + 1;
    operation = Math.random() < 0.6 ? '+' : '-';
    if (operation === '-' && num1 < num2) [num1, num2] = [num2, num1];
    answer = operation === '+' ? num1 + num2 : num1 - num2;
    question = `${num1} ${operation} ${num2} = ?`;
  } else if (age <= 10) {
    const opType = Math.random();
    if (opType < 0.4) {
      num1 = Math.floor(Math.random() * 19) + 1;
      num2 = Math.floor(Math.random() * 19) + 1;
      operation = '+';
      answer = num1 + num2;
    } else if (opType < 0.7) {
      num1 = Math.floor(Math.random() * 19) + 1;
      num2 = Math.floor(Math.random() * 19) + 1;
      if (num1 < num2) [num1, num2] = [num2, num1];
      operation = '-';
      answer = num1 - num2;
    } else {
      num1 = Math.floor(Math.random() * 9) + 1;
      num2 = Math.floor(Math.random() * 9) + 1;
      operation = '×';
      answer = num1 * num2;
    }
    question = `${num1} ${operation} ${num2} = ?`;
  } else if (age <= 13) {
    const opType = Math.random();
    if (opType < 0.3) {
      num1 = Math.floor(Math.random() * 29) + 1;
      num2 = Math.floor(Math.random() * 29) + 1;
      operation = '+';
      answer = num1 + num2;
    } else if (opType < 0.55) {
      num1 = Math.floor(Math.random() * 29) + 1;
      num2 = Math.floor(Math.random() * 29) + 1;
      if (num1 < num2) [num1, num2] = [num2, num1];
      operation = '-';
      answer = num1 - num2;
    } else if (opType < 0.8) {
      num1 = Math.floor(Math.random() * 12) + 1;
      num2 = Math.floor(Math.random() * 12) + 1;
      operation = '×';
      answer = num1 * num2;
    } else {
      num2 = Math.floor(Math.random() * 9) + 1;
      answer = Math.floor(Math.random() * 9) + 1;
      num1 = num2 * answer;
      operation = '÷';
      question = `${num1} ÷ ${num2} = ?`;
      answer = num1 / num2;
    }
    question = `${num1} ${operation} ${num2} = ?`;
  } else {
    const opType = Math.random();
    if (opType < 0.25) {
      num1 = Math.floor(Math.random() * 50) + 10;
      num2 = Math.floor(Math.random() * 50) + 10;
      operation = '+';
      answer = num1 + num2;
    } else if (opType < 0.45) {
      num1 = Math.floor(Math.random() * 50) + 10;
      num2 = Math.floor(Math.random() * 50) + 10;
      if (num1 < num2) [num1, num2] = [num2, num1];
      operation = '-';
      answer = num1 - num2;
    } else if (opType < 0.7) {
      num1 = Math.floor(Math.random() * 15) + 2;
      num2 = Math.floor(Math.random() * 15) + 2;
      operation = '×';
      answer = num1 * num2;
    } else {
      num2 = Math.floor(Math.random() * 12) + 2;
      answer = Math.floor(Math.random() * 12) + 2;
      num1 = num2 * answer;
      operation = '÷';
      question = `${num1} ÷ ${num2} = ?`;
      answer = num1 / num2;
    }
    question = `${num1} ${operation} ${num2} = ?`;
  }
  
  // 선택지 생성
  options = [answer];
  while (options.length < 4) {
    let offset = Math.floor(Math.random() * 10) + 1;
    if (Math.random() < 0.5) offset = -offset;
    const wrong = answer + offset;
    if (wrong >= 0 && !options.includes(wrong) && wrong !== answer) {
      options.push(wrong);
    }
  }
  options.sort(() => Math.random() - 0.5);
  
  const randomPokemon = POKEMON_LIST[Math.floor(Math.random() * POKEMON_LIST.length)];
  
  return {
    question: question,
    options: options,
    answer: answer,
    pokemonName: randomPokemon.name,
    pokemonType: randomPokemon.type,
    answered: false
  };
}

// ===== 🔥 수학 퀴즈 정답 처리 =====
function checkMathAnswer2(selectedIdx) {
  const q = state.mathQuiz;
  if (!q || q.completed) return;
  
  const currentQ = q.questions[q.currentIndex];
  if (currentQ.answered) return;
  
  const buttons = document.querySelectorAll('.opt-btn');
  buttons.forEach(b => b.disabled = true);
  
  const isCorrect = currentQ.options[selectedIdx] === currentQ.answer;
  const fb = document.getElementById('mathFeedback');
  
  // 🔥 정답/오답 표시
  if (isCorrect) {
    buttons[selectedIdx].classList.add('correct');
    fb.textContent = '🎉 정답이에요! 대단해요!';
    fb.className = 'feedback ok';
    q.results.push(true);
    
    // 🔥 보상: 경험치 10% + 카드 15%
    if (state.pet) {
      const threshold = petExpThreshold();
      const expBonus = Math.max(1, Math.round(threshold * 0.1));
      state.pet.exp += expBonus;
      console.log('🧮 수학퀴즈 정답! 포켓몬 경험치 +' + expBonus);
      const result = checkPetLevelUp();
      if (result.evolved) {
        state.pet.justEvolved = true;
        saveState();
        renderPetTab();
      }
      saveState();
      renderPetTab();
    }
    
    // 카드 획득 (15%)
    const gotCard = Math.random() * 100 < 15;
    if (gotCard) {
      const reward = grantCardReward();
      if (reward) {
        setTimeout(() => {
          alert(`🎉 수학퀴즈 보너스! ${reward.target.name} 카드를 획득했어요! (${getRarityInfo(reward.rarity).label})`);
        }, 500);
      }
    }
    
  } else {
    buttons[selectedIdx].classList.add('wrong');
    buttons.forEach((b, i) => {
      if (currentQ.options[i] === currentQ.answer) b.classList.add('correct');
    });
    fb.textContent = `❌ 정답은 ${currentQ.answer}였어요!`;
    fb.className = 'feedback no';
    q.results.push(false);
  }
  
  currentQ.answered = true;
  state.mathStats.total = (state.mathStats.total || 0) + 1;
  if (isCorrect) state.mathStats.correct = (state.mathStats.correct || 0) + 1;
  saveState();
  updateStatline();
  
  // 🔥 다음 문제로 이동 (1.5초 후)
  setTimeout(() => {
    q.currentIndex++;
    // 모든 문제 완료 체크
    if (q.currentIndex >= q.questions.length) {
      q.completed = true;
      saveState();
    }
    renderMathQuiz();
  }, 1500);
}

function renderRaidCardSelector() {
  const ownedCards = Object.keys(state.owned).filter(key => state.owned[key].count > 0);
  
  if (ownedCards.length === 0) {
    return '<div style="color:#8d84b0;font-size:12px;text-align:center;padding:8px;">보유한 카드가 없어요</div>';
  }
  
  const sortedCards = ownedCards.sort((a, b) => {
    const rarityOrder = { 'special': 5, 'ultra-rare': 4, 'super-rare': 3, 'rare': 2, 'common': 1 };
    return (rarityOrder[state.owned[b].rarity] || 0) - (rarityOrder[state.owned[a].rarity] || 0);
  });
  
  let html = '<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:5px;max-height:180px;overflow-y:auto;padding:3px;">';
  
  sortedCards.forEach(key => {
    const c = getPokemonByName(key);
    const info = state.owned[key];
    const rInfo = getRarityInfo(info.rarity);
    if (c) {
      html += `
        <div class="raid-card-select" data-key="${key}" style="
          border:2px solid ${rInfo.color};
          border-radius:8px;
          padding:4px;
          text-align:center;
          cursor:pointer;
          background:rgba(255,255,255,.05);
        ">
          <div class="rds-art">${pokemonImage(c, '32px')}</div>
          <div class="rds-name">${c.name}</div>
          <div class="rds-rarity" style="color:${rInfo.color};">${rInfo.label}</div>
        </div>
      `;
    }
  });
  
  html += '</div>';
  html += `
    <div style="margin-top:4px;font-size:10px;color:#6b6395;text-align:center;">
      💡 등급 높은 순 · 클릭으로 선택
    </div>
    <div id="selectedRaidCardDisplay" style="margin-top:4px;font-size:12px;color:var(--sun-2);text-align:center;font-weight:700;">
      선택된 카드: 없음

  return html;
}

      const evoChain = getEvoChain(p.engName);
      return evoChain && evoChain.length >= 2 && evoChain[evoChain.length-1] === p.engName;
    });
    
    let boss;
    if (finalForms.length === 0) {
      boss = POKEMON_LIST[Math.floor(Math.random() * POKEMON_LIST.length)];
    } else {
      boss = finalForms[Math.floor(Math.random() * finalForms.length)];
    }
    
    state.raid = {
      boss: boss,
      hp: boss.hp * 15,
      maxHp: boss.hp * 15,
      completed: false,

function doRaidAttack() {
  const raid = state.raid;
  if (!raid || raid.completed || !raid.boss) return;
  if ((raid.attackChance || 0) <= 0) {
    alert('공격 기회가 없어요! 생활미션을 완료해주세요.');
    return;
  }
  
  if (!selectedRaidCard) {
    alert('공격할 카드를 선택해주세요!');
    return;
  }
  
  const selectedCard = getPokemonByName(selectedRaidCard);
  if (!selectedCard) {
    alert('선택한 카드를 찾을 수 없어요!');
    return;
  }
  
  const rarityBonus = getRarityDamageBonus(state.owned[selectedRaidCard]?.rarity);
  const baseAtk = selectedCard.atk || 20;
  const randomBonus = Math.floor(Math.random() * 15) + 5;
  const damage = Math.max(10, Math.floor(baseAtk * 0.7 + rarityBonus + randomBonus));
  
  const mult = getEffMult(selectedCard.type, raid.boss.type);
  const finalDamage = Math.floor(damage * mult);
  
  raid.hp = Math.max(0, raid.hp - finalDamage);
  raid.attackChance = (raid.attackChance || 0) - 1;
  
  saveState();
  
  if (raid.hp <= 0) {
    raid.completed = true;
    raid.rewardCollected = false;
    saveState();
    alert(`🎉 ${raid.boss.name}을(를) 물리쳤어요! 레이드 탭에서 보상을 받아주세요!`);
    renderRaidMission();
  } else {
    const effMsg = mult > 1 ? ' (효과 굉장!)' : mult < 1 ? ' (효과 별로...)' : '';
    alert(`⚔️ ${selectedCard.name}의 공격! ${finalDamage}의 데미지!${effMsg}\n남은 HP: ${Math.round(raid.hp)}`);
    renderRaidMission();
  }
}

function collectRaidReward() {
  const raid = state.raid;
  if (!raid || !raid.completed || !raid.boss) {
    alert('레이드를 먼저 클리어해주세요!');
    return;
  }
  
  if (raid.rewardCollected) {
    alert('이미 보상을 받았어요!');
    return;
  }
  
  const boss = raid.boss;
  const rarity = 'special';
  
  if (!state.owned[boss.engName]) {
    state.owned[boss.engName] = { count: 1, rarity: rarity };
  } else {
    state.owned[boss.engName].count += 1;
  }
  
  raid.rewardCollected = true;
  saveState();
  
  showRewardPopup(boss, '🎉 레이드 보상 획득!', '스페셜 등급!');
  
  updateStatline();
  saveState();
  renderDex();
  renderRaidMission();
}

function renderDex() {
  const grid = document.getElementById('dexGrid');
  const total = POKEMON_LIST.length;
  const owned = Object.keys(state.owned).length;
  document.getElementById('dexProgress').style.width = (owned / total * 100) + '%';
  document.getElementById('dexProgressText').textContent = owned + ' / ' + total + ' 마리';
  
  let list = POKEMON_LIST.filter(c => activeFilter === 'all' || c.type === activeFilter);
  
  if (ownershipFilter === 'owned') {
    list = list.filter(c => state.owned[c.engName]);
  } else if (ownershipFilter === 'missing') {
    list = list.filter(c => !state.owned[c.engName]);
  }
  
  if (activeRarity !== 'all') {
    list = list.filter(c => {
      const ownedData = state.owned[c.engName];
      return ownedData && ownedData.rarity === activeRarity;
    });
  }
  
  grid.innerHTML = list.map(c => {
    const ownedData = state.owned[c.engName];
    const has = !!ownedData;
    const rarity = has ? ownedData.rarity : 'common';
    const count = has ? ownedData.count : 0;
    const rInfo = getRarityInfo(rarity);
    const bonus = getRarityBonus(rarity);
    
    const bonusText = has && (bonus.hp || bonus.atk || bonus.def || bonus.spd) ? 
      `✨ +${bonus.hp}HP +${bonus.atk}ATK +${bonus.def}DEF +${bonus.spd}SPD` : '';
    
    return `
      <div class="card mini ${has ? 'rarity-' + rarity : 'locked'}" data-eng="${c.engName}">
        <div class="art">${pokemonImage(c)}</div>
        <div class="name">${has ? c.name : '???'}</div>
        <span class="type-tag" style="background:${getTypeColor(c.type)}">${has ? getTypeLabel(c.type) : '???'}</span>
        <div class="statrow">
          <span>HP<b>${has ? c.hp : '-'}</b></span>
          <span>ATK<b>${has ? c.atk : '-'}</b></span>
          <span>DEF<b>${has ? c.def : '-'}</b></span>
          <span>SPD<b>${has ? c.spd : '-'}</b></span>
        </div>
        ${has ? `<span class="rarity-badge" style="background:${rInfo.color};">${rInfo.emoji} ${rInfo.label} ×${count}</span>` : ''}

function extractEvoChain(chain) {
  const result = [];
  let current = chain;
  
  while (current) {
    const speciesName = current.species.name;
    const pokemon = getPokemonByName(speciesName);
    const evoDetail = current.evolution_details?.[0] || {};
    const level = evoDetail.min_level || evoDetail.min_happiness || null;
    
    result.push({
      name: pokemon ? pokemon.name : speciesName,
      image: pokemon ? pokemon.image : null,
      level: level
    });
    
    if (current.evolves_to && current.evolves_to.length > 0) {
      current = current.evolves_to[0];
    } else {
      break;
    }
  }
  
  return result;
}

function petCreature() {
  if (!state.pet) return null;
  const id = state.pet.evolved3 ? state.pet.evolvedId : 
             state.pet.evolved2 ? state.pet.evolvedId :
             state.pet.evolved ? state.pet.evolvedId : state.pet.baseId;
  return getPokemonByName(id);
}

function tickPet() {
  if (!state.pet) return;
  const now = Date.now();
  const hours = (now - state.pet.lastUpdate) / 3600000;
  if (hours > 0.02) {
    const decay = hours * 4;
    state.pet.hunger = clamp(state.pet.hunger - decay, 0, 100);
    state.pet.happy = clamp(state.pet.happy - decay * 0.8, 0, 100);
    state.pet.energy = clamp(state.pet.energy - decay * 0.6, 0, 100);
    state.pet.lastUpdate = now;
    saveState();
  }
}

function petExpThreshold() { return state.pet.level * 25; }

function checkPetLevelUp() {
  let leveled = false, evolved = false;
  let evoMessage = '';
  let evoPokemon = null;
  
  while (state.pet.exp >= petExpThreshold()) {
    state.pet.exp -= petExpThreshold();
    state.pet.level++;
    leveled = true;
    
    if (state.pet.level >= 5 && !state.pet.evolved) {
      const evoMap = {
        'bulbasaur': 'ivysaur',
        'charmander': 'charmeleon',
        'squirtle': 'wartortle',
        'caterpie': 'metapod',
        'weedle': 'kakuna',
        'pidgey': 'pidgeotto'
      };
      const evoId = evoMap[state.pet.baseId];
      if (evoId) {
        state.pet.evolved = true;
        state.pet.evolvedId = evoId;
        evolved = true;
        evoMessage = '🎉 1차 진화!';
        evoPokemon = getPokemonByName(evoId);
        const evoPokemonData = getPokemonByName(evoId);
        if (evoPokemonData && !state.owned[evoPokemonData.engName]) {
          const rarity = rollRarity();
          state.owned[evoPokemonData.engName] = { count: 1, rarity: rarity };
        }
      }
    }
    
    if (state.pet.level >= 15 && state.pet.evolved && !state.pet.evolved2) {
      const evoMap2 = {
        'ivysaur': 'venusaur',
        'charmeleon': 'charizard',
        'wartortle': 'blastoise',
        'metapod': 'butterfree',
        'kakuna': 'beedrill',
        'pidgeotto': 'pidgeot'
      };
      const evoId2 = evoMap2[state.pet.evolvedId];
      if (evoId2) {
        state.pet.evolved2 = true;
        state.pet.evolvedId = evoId2;
        evolved = true;
        evoMessage = '🎉 2차 진화!';
        evoPokemon = getPokemonByName(evoId2);
        const evoPokemonData = getPokemonByName(evoId2);
        if (evoPokemonData && !state.owned[evoPokemonData.engName]) {
          const rarity = rollRarity();
          state.owned[evoPokemonData.engName] = { count: 1, rarity: rarity };
        }
      }
    }
    
    if (state.pet.level >= 20 && state.pet.evolved2 && !state.pet.evolved3) {
      const evoMap3 = {};
      const evoId3 = evoMap3[state.pet.evolvedId];
      if (evoId3) {
        state.pet.evolved3 = true;
        state.pet.evolvedId = evoId3;
        evolved = true;
        evoMessage = '🎉 최종 진화!';
        evoPokemon = getPokemonByName(evoId3);
        const evoPokemonData = getPokemonByName(evoId3);
        if (evoPokemonData) {
          const rarity = rollRarity();
          if (!state.owned[evoPokemonData.engName]) {
            state.owned[evoPokemonData.engName] = { count: 1, rarity: rarity };
          } else {
            state.owned[evoPokemonData.engName].count += 1;
          }
        }
      } else {
        if (!state.pet.finalBonus) {
          state.pet.finalBonus = true;
          const currentPokemon = getPokemonByName(state.pet.evolvedId);
          if (currentPokemon && !state.owned[currentPokemon.engName]) {
            const rarity = 'special';
            state.owned[currentPokemon.engName] = { count: 1, rarity: rarity };
            evoMessage = '🎉 Lv.20 달성!';
            evoPokemon = currentPokemon;
          }
        }
      }
    }
  }
  
  if (evolved && evoPokemon) {
    showRewardPopup(evoPokemon, evoMessage, '새로운 모습으로 진화했어요!');
    saveState();
    renderPetTab();
  }
  
  return { leveled, evolved };
}

function isOnCooldown(lastAction, cooldownMs) {
  if (!lastAction) return false;
  return Date.now() - lastAction < cooldownMs;
}

function getCooldownRemaining(lastAction, cooldownMs) {
  if (!lastAction) return 0;
  const elapsed = Date.now() - lastAction;
  return Math.max(0, cooldownMs - elapsed);
}

      <div class="plevel">Lv.${p.level} ${p.evolved3 ? '🌟' : p.evolved2 ? '⭐' : p.evolved ? '🌱' : ''}</div>
    </div>
    <div class="pet-mood">${petStatusMessage()}</div>
    <div style="font-family:var(--font-mono);font-size:9px;color:#B7AFDE;text-align:center;margin:2px 0 10px;">${evoStatus}</div>
    <div class="stat-row hunger"><div class="stat-label"><span>배고픔</span><span>${Math.round(p.hunger)}</span></div><div class="progress-bar"><div style="width:${p.hunger}%"></div></div></div>
    <div class="stat-row happy"><div class="stat-label"><span>기분</span><span>${Math.round(p.happy)}</span></div><div class="progress-bar"><div style="width:${p.happy}%"></div></div></div>
    <div class="stat-row energy"><div class="stat-label"><span>에너지</span><span>${Math.round(p.energy)}</span></div><div class="progress-bar"><div style="width:${p.energy}%"></div></div></div>
    <div class="stat-row exp"><div class="stat-label"><span>경험치</span><span>${Math.round(p.exp)}/${petExpThreshold()}</span></div><div class="progress-bar"><div style="width:${Math.min(100, p.exp / petExpThreshold() * 100)}%"></div></div></div>
    <div class="pet-actions">
      <button class="btn" id="feedBtn" ${feedReady ? '' : 'disabled'}>🍖 먹이</button>
      <button class="btn" id="playBtn" ${playReady ? '' : 'disabled'}>🎾 놀이</button>
      <button class="btn" id="sleepBtn" ${sleepReady ? '' : 'disabled'}>💤 재우기</button>
    </div>
    <div style="display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin-top:3px;">
      ${!feedReady ? '<span class="cooldown-text">⏳ ' + formatTime(feedCooldown) + '</span>' : ''}
      ${!playReady ? '<span class="cooldown-text">⏳ ' + formatTime(playCooldown) + '</span>' : ''}
      ${!sleepReady ? '<span class="cooldown-text">⏳ ' + formatTime(sleepCooldown) + '</span>' : ''}
    </div>
  `;
  
  document.getElementById('feedBtn').addEventListener('click', function() {
    if (isOnCooldown(p.lastFeed, COOLDOWN.FEED)) return;
    petAction('hunger', 25, 'exp', 5);
    state.pet.lastFeed = Date.now();
    saveState();
    renderPetTab();
  });
  
  document.getElementById('playBtn').addEventListener('click', function() {
    if (isOnCooldown(p.lastPlay, COOLDOWN.PLAY)) return;
    petAction('happy', 25, 'exp', 8);
    state.pet.energy = clamp(state.pet.energy - 10, 0, 100);
    state.pet.lastPlay = Date.now();
    saveState();
    renderPetTab();
  });
  
  document.getElementById('sleepBtn').addEventListener('click', function() {
    if (isOnCooldown(p.lastSleep, COOLDOWN.SLEEP)) return;
    petAction('energy', 30, 'exp', 3);
    state.pet.lastSleep = Date.now();
    saveState();
    renderPetTab();
  });
}

function petAction(statKey, statAmt, expKey, expAmt) {
  state.pet[statKey] = clamp(state.pet[statKey] + statAmt, 0, 100);
  state.pet[expKey] = state.pet[expKey] + expAmt;
  const result = checkPetLevelUp();
  if (result.evolved) state.pet.justEvolved = true;
  saveState();
  renderPetTab();
}

// ===== 배틀 (간소화) =====
let battleMode = 'pvp';
document.querySelectorAll('.mode-toggle button').forEach(btn => {
  btn.addEventListener('click', function() {
    document.querySelectorAll('.mode-toggle button').forEach(b => b.classList.remove('active'));
    this.classList.add('active');
    battleMode = this.dataset.mode;

  });
});

function ownedList() {
  return POKEMON_LIST.filter(c => state.owned[c.engName]);
}

function renderBattleSetup() {
  const slots = document.getElementById('teamSlots');
  slots.innerHTML = '';
  for (let i = 0; i < 3; i++) {
    const engName = state.team[i];
    const c = engName ? getPokemonByName(engName) : null;
    const div = document.createElement('div');
    div.className = 'slot' + (c ? ' filled' : '');
    div.innerHTML = c
      ? `<span class="x" data-remove="${i}">✕</span><div class="mini-art">${pokemonImage(c)}</div>`
      : `<span style="font-family:var(--font-mono);font-size:10px;color:#8d84b0;">+ 선택</span>`;
    div.addEventListener('click', function(e) {
      if (e.target.dataset.remove !== undefined && e.target.dataset.remove !== '') {
        state.team[i] = null;
        state.team = state.team.filter(x => x);
        saveState();
        renderBattleSetup();
        return;
      }
      openPicker(i);
    });
    slots.appendChild(div);
  }
  document.getElementById('battleBody').innerHTML = '';
  if (state.team.filter(x => x).length === 3) {
    if (battleMode === 'pvp') renderPvpIntro();
    else renderAiIntro();
  } else {
    document.getElementById('battleBody').innerHTML = `<div class="empty-note">카드 3장을 골라주세요</div>`;
  }
}

function openPicker(slotIndex) {
  const picker = document.getElementById('picker');
  const owned = ownedList();
  if (owned.length === 0) {
    document.getElementById('battleBody').innerHTML = `<div class="empty-note">보유한 카드가 없어요</div>`;
    return;
  }
  picker.classList.add('open');
  document.getElementById('pickGrid').innerHTML = owned.map(c => {
    const already = state.team.includes(c.engName);
    return `<div class="pick-item ${already ? 'disabled' : ''}" data-id="${c.engName}">${pokemonImage(c)}<div class="n">${c.name}</div></div>`;
  }).join('');
  document.querySelectorAll('.pick-item').forEach(el => {
    el.addEventListener('click', function() {
      state.team[slotIndex] = this.dataset.id;
      picker.classList.remove('open');
      saveState();
      renderBattleSetup();
    });
  });
}

// ===== AI 배틀 (간소화) =====
let aiBattle = null;
function makeEnemyTeam() {
  const pool = POKEMON_LIST.filter(c => state.owned[c.engName]);
  const team = [];
  const shuffled = [...pool].sort(() => Math.random() - 0.5);
  for (let i = 0; i < 3 && i < shuffled.length; i++) {
    team.push({ ...shuffled[i], curHp: shuffled[i].hp });
  }
  while (team.length < 3) {
    const c = POKEMON_LIST[Math.floor(Math.random() * POKEMON_LIST.length)];
    if (!team.find(t => t.engName === c.engName)) {
      team.push({ ...c, curHp: c.hp });
    }
  }
  return team;
}

function renderAiIntro() {
  document.getElementById('battleBody').innerHTML = `<div style="text-align:center;margin-top:3px;"><button class="btn" id="startAiBtn">연습 배틀 시작</button></div>`;
  document.getElementById('startAiBtn').addEventListener('click', function() {
    const playerTeam = state.team.map(engName => {
      const c = getPokemonByName(engName);
      return c ? { ...c, curHp: c.hp } : null;
    }).filter(Boolean);
    aiBattle = { player: playerTeam, enemy: makeEnemyTeam(), pActive: 0, eActive: 0, log: [], over: false };
    addAiLog('상대 트레이너가 나타났다!', 'sys');
    renderAiArena();
  });
}

function addAiLog(t, c) {
  if (!c) c = '';
  aiBattle.log.unshift(`<p class="${c}">${t}</p>`);
  if (aiBattle.log.length > 40) aiBattle.log.pop();
}

function renderAiArena() {
  const p = aiBattle.player[aiBattle.pActive];
  const e = aiBattle.enemy[aiBattle.eActive];
  document.getElementById('battleBody').innerHTML = `
    <div class="arena">
      <div class="vs-row">
        <div class="fighter"><div class="art-wrap">${pokemonImage(p)}</div><div class="fname">${p.name}</div>
          <div class="hpbar ${p.curHp / p.hp < 0.3 ? 'low' : ''}"><div style="width:${Math.max(0, p.curHp / p.hp * 100)}%"></div></div>
          <div class="hptext">${Math.max(0, p.curHp)} / ${p.hp}</div></div>
        <div class="vs-seal">VS</div>
        <div class="fighter"><div class="art-wrap">${pokemonImage(e)}</div><div class="fname">${e.name}</div>
          <div class="hpbar ${e.curHp / e.hp < 0.3 ? 'low' : ''}"><div style="width:${Math.max(0, e.curHp / e.hp * 100)}%"></div></div>
          <div class="hptext">${Math.max(0, e.curHp)} / ${e.hp}</div></div>
      </div>
      <div class="log">${aiBattle.log.join('')}</div>
      <div class="battle-actions">${aiBattle.over ? `<button class="btn" id="endAiBtn">팀 다시 구성</button>` : `<button class="btn" id="attackAiBtn">공격</button>`}</div>
    </div>`;
  if (aiBattle.over) {
    document.getElementById('endAiBtn').addEventListener('click', function() { aiBattle = null; renderBattleSetup(); });
  } else {
    document.getElementById('attackAiBtn').addEventListener('click', doAiTurn);
  }
}

function doAiTurn() {
  const p = aiBattle.player[aiBattle.pActive];
  const e = aiBattle.enemy[aiBattle.eActive];
  const order = p.spd >= e.spd ? ['p', 'e'] : ['e', 'p'];
  for (const side of order) {
    if (aiBattle.over) break;
    if (side === 'p') {
      if (p.curHp <= 0) continue;
      const mult = getEffMult(p.type, e.type);
      const rarityBonus = getRarityDamageBonus(state.owned[p.engName]?.rarity);
      const dmg = Math.max(3, Math.round(p.atk * mult - e.def * 0.35) + rarityBonus);
      e.curHp -= dmg;
      addAiLog(p.name + '의 공격! ' + e.name + '에게 ' + dmg + ' 피해' + (mult > 1 ? ' (효과 굉장!)' : mult < 1 ? ' (효과 별로...)' : ''), mult > 1 ? 'eff' : mult < 1 ? 'bad' : '');
      if (e.curHp <= 0) {
        addAiLog(e.name + ' 쓰러짐!', 'sys');
        const next = aiBattle.enemy.findIndex((c, i) => i > aiBattle.eActive && c.curHp > 0);
        if (next === -1) { endAiBattle(true); break; }
        aiBattle.eActive = next;
        addAiLog('상대가 ' + aiBattle.enemy[next].name + '을(를) 내보냈다!', 'sys');
      }
    } else {
      const ee = aiBattle.enemy[aiBattle.eActive];
      if (ee.curHp <= 0) continue;
      const mult = getEffMult(ee.type, p.type);
      const dmg = Math.max(3, Math.round(ee.atk * mult - p.def * 0.35));
      p.curHp -= dmg;
      addAiLog(ee.name + '의 공격! ' + p.name + '에게 ' + dmg + ' 피해' + (mult > 1 ? ' (효과 굉장!)' : mult < 1 ? ' (효과 별로...)' : ''), mult > 1 ? 'bad' : mult < 1 ? 'eff' : '');
      if (p.curHp <= 0) {
        addAiLog(p.name + ' 쓰러짐!', 'sys');
        const next = aiBattle.player.findIndex((c, i) => i > aiBattle.pActive && c.curHp > 0);
        if (next === -1) { endAiBattle(false); break; }
        aiBattle.pActive = next;
        addAiLog(aiBattle.player[next].name + '을(를) 내보냈다!', 'sys');
      }
    }
  }
  renderAiArena();
}

function endAiBattle(playerWon) {
  aiBattle.over = true;
  if (playerWon) { state.wins++; addAiLog('승리! 🎉', 'eff'); }
  else { state.losses++; addAiLog('패배...', 'bad'); }
  updateStatline(); saveState();
}

function setPvpFeedback(msg, bad) {
  const el = document.getElementById('pvpFeedback');
  if (el) { el.textContent = msg; el.className = 'quiz-feedback ' + (bad ? 'no' : 'ok'); }
}

async function createBattleRoom() {
  if (state.team.filter(x => x).length < 3) {
    setPvpFeedback('배틀 팀을 먼저 구성해주세요! (3장 필요)', true);
    return;
  }
  
  const code = String(Math.floor(1000 + Math.random() * 9000));
  const team = state.team.map(engName => {
    const c = getPokemonByName(engName);
    return c ? { ...c, curHp: c.hp } : null;
  }).filter(Boolean);
  
  const roomData = {
    host: team,
    guest: null,
    turn: 'host',
    status: 'waiting',
    log: ['🔵 방이 생성됐어요! 친구를 기다리는 중...'],
    createdAt: Date.now(),
    winner: null
  };
  
  try {
    await db.ref('battles/' + code).set(roomData);
    myBattleRoom = { code, side: 'host' };
    setPvpFeedback('✅ 방 생성! 코드: ' + code, false);
    setupBattleListener(code);
    showWaitingRoom(code);
  } catch (e) {
    setPvpFeedback('방 생성 실패: ' + e.message, true);
  }
}

async function joinBattleRoom(code) {
  if (state.team.filter(x => x).length < 3) {
    setPvpFeedback('배틀 팀을 먼저 구성해주세요! (3장 필요)', true);
    return;
  }
  
  try {
    const snapshot = await db.ref('battles/' + code).once('value');
    const room = snapshot.val();
    
    if (!room) {
      setPvpFeedback('코드를 찾을 수 없어요', true);
      return;
    }
    
    if (room.status !== 'waiting' || room.guest) {
      setPvpFeedback('이미 배틀이 진행 중인 방이에요', true);
      return;
    }
    
    const team = state.team.map(engName => {
      const c = getPokemonByName(engName);
      return c ? { ...c, curHp: c.hp } : null;
    }).filter(Boolean);
    
    await db.ref('battles/' + code).update({
      guest: team,
      status: 'active',
      turn: 'host',
      log: ['🟢 친구가 참가했어요! 배틀 시작!']
    });
    
    myBattleRoom = { code, side: 'guest' };
    setPvpFeedback('✅ 배틀에 참가했어요!', false);
    setupBattleListener(code);
    showWaitingRoom(code);
  } catch (e) {
    setPvpFeedback('참가 실패: ' + e.message, true);
  }
}

function setupBattleListener(code) {
  if (battleListener) {
    battleListener.off();
  }
  
  battleListener = db.ref('battles/' + code);
  battleListener.on('value', function(snapshot) {
    const room = snapshot.val();
    if (!room) {
      document.getElementById('battleBody').innerHTML = '<div class="empty-note">방이 사라졌어요</div>';
      return;
    }
    
    if (room.status === 'waiting') {
      showWaitingRoom(code);
    } else {
      renderBattleArena(room);
    }
  });
}

function showWaitingRoom(code) {
  document.getElementById('battleBody').innerHTML = `
    <div class="room-box">
      <div style="font-family:var(--font-mono);font-size:9px;color:#B7AFDE;">친구에게 이 코드를 알려주세요</div>
      <div class="room-code">${code}</div>
      <div style="font-family:var(--font-mono);font-size:10px;color:var(--sun-2);" class="waiting-dots">친구를 기다리는 중</div>
      <button class="btn ghost small" id="cancelRoomBtn" style="margin-top:10px;">방 나가기</button>
    </div>`;
  document.getElementById('cancelRoomBtn').addEventListener('click', leaveBattleRoom);
}

function renderBattleArena(room) {
  if (!myBattleRoom) return;
  
  const mySide = myBattleRoom.side;
  const oppSide = mySide === 'host' ? 'guest' : 'host';
  const me = room[mySide];
  const opp = room[oppSide];
  
  if (!me || !opp) {
    document.getElementById('battleBody').innerHTML = '<div class="empty-note">상대방이 아직 팀을 선택하지 않았어요...</div>';
    return;
  }
  
  const myPokemon = me[0];
  const oppPokemon = opp[0];
  const myTurn = room.turn === mySide;
  const isFinished = room.status === 'finished';
  
  document.getElementById('battleBody').innerHTML = `
    <div class="arena">
      <div class="vs-row">
        <div class="fighter">
          <div class="art-wrap">${pokemonImage(myPokemon)}</div>
          <div class="fname">${myPokemon.name}</div>
          <div class="hpbar ${myPokemon.curHp / myPokemon.hp < 0.3 ? 'low' : ''}">
            <div style="width:${Math.max(0, myPokemon.curHp / myPokemon.hp * 100)}%"></div>
          </div>
          <div class="hptext">${Math.max(0, myPokemon.curHp)} / ${myPokemon.hp}</div>
        </div>
        <div class="vs-seal">VS</div>
        <div class="fighter">
          <div class="art-wrap">${pokemonImage(oppPokemon)}</div>
          <div class="fname">${oppPokemon.name}</div>
          <div class="hpbar ${oppPokemon.curHp / oppPokemon.hp < 0.3 ? 'low' : ''}">
            <div style="width:${Math.max(0, oppPokemon.curHp / oppPokemon.hp * 100)}%"></div>
          </div>
          <div class="hptext">${Math.max(0, oppPokemon.curHp)} / ${oppPokemon.hp}</div>
        </div>
      </div>
      
      ${isFinished ? `
        <div class="turn-banner" style="font-size:13px;">
          ${room.winner === mySide ? '🎉 승리!' : room.winner === oppSide ? '아쉬워요...' : '무승부!'}
        </div>
      ` : `
        <div class="turn-banner">${myTurn ? '🔥 내 차례! 공격!' : '⏳ 상대 차례...'}</div>
      `}
      
      <div class="log">
        ${room.log && room.log.length > 0 ? room.log.map(t => '<p>' + t + '</p>').join('') : '<p>배틀 시작!</p>'}
      </div>
      
      <div class="battle-actions">
        ${isFinished ? `
          <button class="btn" id="exitBattleBtn">방 나가기</button>
        ` : `
          <button class="btn" id="attackBtn" ${myTurn && !isFinished ? '' : 'disabled'}>⚔️ 공격</button>
          <button class="btn ghost small" id="exitBattleBtn2">나가기</button>
        `}
      </div>
    </div>
  `;
  
  if (isFinished) {
    document.getElementById('exitBattleBtn').addEventListener('click', leaveBattleRoom);
    if (room.winner === mySide && !room._counted) {
      state.wins++;
      updateStatline();
      saveState();
      db.ref('battles/' + myBattleRoom.code).update({ _counted: true });
    }
  } else {
    document.getElementById('attackBtn')?.addEventListener('click', doBattleAttack);
    document.getElementById('exitBattleBtn2')?.addEventListener('click', leaveBattleRoom);
  }
}

async function doBattleAttack() {
  if (!myBattleRoom) return;
  
  const code = myBattleRoom.code;
  const mySide = myBattleRoom.side;
  const oppSide = mySide === 'host' ? 'guest' : 'host';
  
  try {
    const snapshot = await db.ref('battles/' + code).once('value');
    const room = snapshot.val();
    
    if (!room || room.status === 'finished') return;
    if (room.turn !== mySide) return;
    
    const me = room[mySide];
    const opp = room[oppSide];
    
    if (!me || !opp) return;
    
    const myPokemon = me[0];
    const oppPokemon = opp[0];
    
    const mult = getEffMult(myPokemon.type, oppPokemon.type);
    const rarityBonus = getRarityDamageBonus(state.owned[myPokemon.engName]?.rarity);
    const dmg = Math.max(3, Math.round(myPokemon.atk * mult - oppPokemon.def * 0.35) + rarityBonus);
    oppPokemon.curHp = Math.max(0, oppPokemon.curHp - dmg);
    
    let logMsg = myPokemon.name + '의 공격! ' + oppPokemon.name + '에게 ' + dmg + ' 피해';
    if (mult > 1) logMsg += ' (효과 굉장!)';
    else if (mult < 1) logMsg += ' (효과 별로...)';
    
    let nextTurn = oppSide;
    if (oppPokemon.curHp <= 0) {
      logMsg += ' → ' + oppPokemon.name + ' 쓰러짐!';
      const nextIdx = opp.findIndex((p, i) => i > 0 && p.curHp > 0);
      if (nextIdx === -1) {
        await db.ref('battles/' + code).update({
          status: 'finished',
          winner: mySide,
          log: [logMsg, ...(room.log || [])]
        });
        return;
      } else {
        const nextPokemon = opp[nextIdx];
        opp[0] = nextPokemon;
        opp.splice(nextIdx, 1);
        logMsg += ' → 상대가 ' + nextPokemon.name + '을(를) 내보냈다!';
        nextTurn = oppSide;
      }
    } else {
      nextTurn = oppSide;
    }
    
    await db.ref('battles/' + code).update({
      [mySide]: me,
      [oppSide]: opp,
      turn: nextTurn,
      log: [logMsg, ...(room.log || [])]
    });
    
  } catch (e) {
    console.error('공격 실패:', e);
    setPvpFeedback('공격 중 오류가 발생했어요', true);
  }
}

function leaveBattleRoom() {
  if (battleListener) {
    battleListener.off();
    battleListener = null;
  }
  
  if (myBattleRoom) {
    if (myBattleRoom.side === 'host') {
      db.ref('battles/' + myBattleRoom.code).remove().catch(() => {});
    }
    myBattleRoom = null;
  }
  
  document.getElementById('battleBody').innerHTML = '<div class="empty-note">배틀에서 나갔어요</div>';
  setTimeout(() => renderBattleSetup(), 500);
}
